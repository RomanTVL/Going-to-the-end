<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Going to the End</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Cormorant+SC:wght@500;600&family=Alumni+Sans:wght@800&family=Amatic+SC:wght@700&family=Comfortaa:wght@700&family=Days+One&family=Exo+2:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Jura:wght@700&family=Kelly+Slab&family=Lobster&family=Marck+Script&family=Old+Standard+TT:wght@700&family=Pacifico&family=Oswald:wght@400;500;600&family=Philosopher:wght@400;700&family=Pixelify+Sans:wght@500;700&family=Playfair+Display:ital,wght@0,600;1,500&family=Press+Start+2P&family=Rubik+Mono+One&family=Rubik:wght@700&family=Rubik+Dirt&family=Ruslan+Display&family=Russo+One&family=Seymour+One&family=Tiny5&family=Ubuntu+Mono:wght@700&family=Unbounded:wght@500;700&family=Yeseva+One&display=swap">
<style>
/* Layout: тёмный зал, один экран по центру, под ним табличка с номером сеанса и таймером */
:root {
  --hall: #050405;
  --screen: #000;
  --film: #efe8dc;
  --dim: #8e877c;
  --seat: #1c1719;
  --seat-edge: #2c2427;
  --cut: #ff4a3d;
  --screen-w: min(100%, calc((100dvh - 210px) * 0.8), 560px);
  --f-film: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-slate: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(70% 50% at 50% 30%, #151012 0%, var(--hall) 70%) fixed, var(--hall);
  color: var(--film);
  font-family: var(--f-slate);
  font-size: 13px;
}
.hall {
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen {
  position: relative;
  width: var(--screen-w);
  min-width: min(260px, 100%);
  aspect-ratio: 4 / 5;
  background: var(--screen);
  box-shadow: 0 0 0 1px #201a1c, 0 0 80px rgba(239, 232, 220, .07), 0 40px 120px -40px rgba(239, 232, 220, .18);
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
/* the WebGL copy of the frame sits on top; taps go through to the game canvas below */
canvas.fx { position: absolute; inset: 0; pointer-events: none; visibility: hidden; }
.slate {
  width: var(--screen-w);
  margin: 0;
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px;
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.slate b { color: var(--film); font-weight: 500; }
.slate b.late { color: var(--cut); }
.toggles { justify-content: flex-start; gap: 8px; }
.toggle {
  font: 500 11px var(--f-slate); letter-spacing: .14em; text-transform: uppercase;
  color: var(--dim); background: transparent; border: 1px solid var(--seat-edge);
  padding: 6px 10px; cursor: pointer;
}
.toggle:hover { color: var(--film); border-color: var(--dim); }
.toggle[aria-pressed="true"] { color: var(--film); border-color: var(--film); }
.hint { color: #6a625b; letter-spacing: .08em; justify-content: center; text-align: center; text-transform: none; }
.pads { display: none; gap: 10px; width: var(--screen-w); }
/* on a big monitor the screen fills the height of the window */
@media (min-width: 900px) and (min-height: 760px) { :root { --screen-w: min(100%, calc((100dvh - 150px) * 0.8)); } .hint { display: none; } }
body.fs .hall { gap: 8px; padding-block: 8px; }
body.fs { --screen-w: min(100%, calc((100dvh - 70px) * 0.8)); }
body.fs .toggles, body.fs .hint { display: none; }
.slate .cheat { color: var(--cut); }
.pads button {
  flex: 1; height: 58px; font: 500 20px var(--f-slate); color: var(--film);
  background: var(--seat); border: 1px solid var(--seat-edge); border-radius: 0;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
.pads button.on { background: var(--seat-edge); border-color: var(--film); }
.pads .jump { flex: 1.4; }
button:focus-visible { outline: 2px solid var(--film); outline-offset: 2px; }
@media (pointer: coarse) { .pads { display: flex; } .hint { display: none; } }
</style>
</head>
<body>
<main class="hall">
  <div class="screen"><canvas id="cv" aria-label="Экран с титрами"></canvas></div>
  <div class="slate">
    <span><span data-t>Сеанс</span> <b id="lvl">1 / 11</b></span>
    <span><span data-t>Дубль</span> <b id="take">1</b></span>
    <span>★ <b id="stars">0</b></span>
    <span><span data-t>Таймер</span> <b id="time">00:00</b></span>
    <span class="cheat" id="cheatTag" data-t hidden>Читы</span>
  </div>
  <div class="pads" id="pads">
    <button data-k="left" aria-label="Влево">◀</button>
    <button data-k="jump" class="jump" aria-label="Прыжок">▲</button>
    <button data-k="right" aria-label="Вправо">▶</button>
  </div>
  <div class="slate toggles">
    <button class="toggle" id="snd" aria-pressed="true" data-t>Звук</button>
    <button class="toggle" id="pause" aria-pressed="false" data-t="Пауза (кнопка)">Пауза</button>
    <button class="toggle" id="fresh" data-t hidden>Новый забег</button>
    <button class="toggle" id="full" aria-pressed="false" data-t>Полный экран</button>
  </div>
  <p class="slate hint" data-t>← → или A D — идти · Пробел или ↑ — прыжок · P — пауза · M — звук · N — музыка · F — полный экран</p>
</main>

<!-- @script -->
</body>
</html>
