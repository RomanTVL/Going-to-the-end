<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Going to the End</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: тёмный зал, один экран по центру, под ним табличка с номером дубля */
:root {
  --hall: #050405;
  --screen: #000;
  --film: #efe8dc;
  --dim: #8e877c;
  --seat: #1c1719;
  --seat-edge: #2c2427;
  --cut: #ff4a3d;
  --f-film: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-slate: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(70% 50% at 50% 30%, #151012 0%, var(--hall) 70%) fixed, var(--hall);
  color: var(--film);
  font-family: var(--f-slate);
  font-size: 13px;
}
.hall {
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen {
  width: min(100%, calc((100dvh - 210px) * 0.8), 560px);
  min-width: min(260px, 100%);
  aspect-ratio: 4 / 5;
  background: var(--screen);
  box-shadow: 0 0 0 1px #201a1c, 0 0 80px rgba(239, 232, 220, .07), 0 40px 120px -40px rgba(239, 232, 220, .18);
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.slate {
  width: min(100%, 560px);
  margin: 0;
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px;
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.slate b { color: var(--film); font-weight: 500; }
.toggles { justify-content: flex-start; gap: 8px; }
.toggle {
  font: 500 11px var(--f-slate); letter-spacing: .14em; text-transform: uppercase;
  color: var(--dim); background: transparent; border: 1px solid var(--seat-edge);
  padding: 6px 10px; cursor: pointer;
}
.toggle:hover { color: var(--film); border-color: var(--dim); }
.toggle[aria-pressed="true"] { color: var(--film); border-color: var(--film); }
.toggle.hard[aria-pressed="true"] { color: var(--cut); border-color: var(--cut); }
.toggle:disabled { opacity: .4; cursor: default; }
.hint { color: #6a625b; letter-spacing: .08em; justify-content: center; text-align: center; text-transform: none; }
.pads { display: none; gap: 10px; width: min(100%, 560px); }
.pads button {
  flex: 1; height: 58px; font: 500 20px var(--f-slate); color: var(--film);
  background: var(--seat); border: 1px solid var(--seat-edge); border-radius: 0;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
.pads button.on { background: var(--seat-edge); border-color: var(--film); }
.pads .jump { flex: 1.4; }
button:focus-visible { outline: 2px solid var(--film); outline-offset: 2px; }
@media (pointer: coarse) { .pads { display: flex; } .hint { display: none; } }
</style>
</head>
<body>
<main class="hall">
  <div class="screen"><canvas id="cv" aria-label="Экран с титрами"></canvas></div>
  <div class="slate">
    <span>Дубль <b id="take">1</b></span>
    <span>Сцена <b id="scene">—</b></span>
    <span>★ <b id="stars">0</b></span>
    <span>Время <b id="time">00:00</b></span>
    <span>Рекорд <b id="best">—</b></span>
  </div>
  <div class="pads" id="pads">
    <button data-k="left" aria-label="Влево">◀</button>
    <button data-k="jump" class="jump" aria-label="Прыжок">▲</button>
    <button data-k="right" aria-label="Вправо">▶</button>
  </div>
  <div class="slate toggles">
    <button class="toggle" id="snd" aria-pressed="true">Звук</button>
    <button class="toggle" id="pause" aria-pressed="false">Пауза</button>
    <button class="toggle hard" id="dc" aria-pressed="false" hidden>Режиссёрская версия</button>
  </div>
  <p class="slate hint">← → или A D — идти · Пробел или ↑ — прыжок · P — пауза · M — звук</p>
</main>

<script>
(() => {
'use strict';

const W = 540, H = 675, CX = W / 2;
const LINE = 74;                       // distance between credit lines
const PW = 10, PH = 10;                // the dot
const GRAV = 1500, JUMP = 520, RUN = 230, ACC = 2200, MAXFALL = 780;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FILM = '#efe8dc', DIM = '#8e877c', CUT = '#ff4a3d';
const SERIF = '"Cormorant Garamond", Georgia, "Times New Roman", serif';
const MONO = '"IBM Plex Mono", ui-monospace, monospace';
const REC_HZ = 30;

// '~' marks a name that crumbles a moment after you stand on it.
// A trailing object adds behaviour: blink (the line goes dark every few seconds), sway (it drifts sideways).
// ['*', dx, dy] hides a star dx from the centre and dy above the next line.
const CREDITS = [
  ['title', 'GOING TO THE END'],
  ['c', 'Фильм окончен. Не вставай.'],
  ['h', 'В ролях'],
  ['r', 'Точка', 'Ты'],
  ['r', 'Гравитация', 'Сама себя'],
  ['r', 'Верхний край кадра', 'Время'],
  ['r', 'Нижний край кадра', 'Пустота'],
  ['*', -150, -34],
  ['c', 'а также'],
  ['w', 'Тень', 'Свет', 'Пыль', 'Плёнка'],
  ['r', 'Зритель в третьем ряду', '~Неизвестен'],
  ['*', 175, -46],
  ['c', 'Все персонажи вымышлены, кроме тебя'],
  ['h', 'Постановка'],
  ['r', 'Режиссёр', 'Случай'],
  ['r', 'Сценарий', 'Никто не дочитал'],
  ['r', 'Оператор', 'Камера, что не ждёт'],
  ['*', 0, -44],
  ['r', 'Монтаж', '~Вырезано'],
  ['*', 150, -40],
  ['w', 'Аня', 'Боря', 'Вера', '~Гоша'],
  ['*', 0, -44],
  ['r', 'Свет', 'Проектор № 2', { blink: 2.4 }],
  ['r', 'Помощник режиссёра', 'Кофе'],
  ['c', 'Снято одним дублем. Почти.'],
  ['h', 'Музыка'],
  ['r', 'Композитор', 'Тишина'],
  ['r', 'Звукорежиссёр', 'Шорох попкорна'],
  ['*', -228, -46],
  ['w', 'До', 'Ре', '~Ми', 'Фа', 'Соль', '~Ля', 'Си'],
  ['r', 'Песня «До конца»', 'Все, кто остался'],
  ['*', 222, -30],
  ['c', 'Музыка не прозвучала ни разу'],
  ['h', 'Транспорт'],
  ['r', 'Водитель', 'Без прав', { sway: 70 }],
  ['*', 0, -50],
  ['r', 'Лифт', 'Только вниз', { sway: 90, phase: 2 }],
  ['r', 'Эскалатор', 'На ремонте', { blink: 2, phase: 1 }],
  ['c', 'Ни одна машина не доехала'],
  ['h', 'Каскадёры'],
  ['r', 'Падения', 'Ты'],
  ['r', 'Ещё падения', 'Тоже ты'],
  ['r', 'Дублёр', '~Отсутствовал'],
  ['*', -110, -40],
  ['w', '~Раз', 'Два', '~Три'],
  ['c', '~Ни одна точка не пострадала'],
  ['r', 'Страховка', '~Не предусмотрена', { sway: 50 }],
  ['h', 'Благодарности'],
  ['r', 'Тем, кто не ушёл', 'Спасибо'],
  ['r', 'Тем, кто ушёл', '~Тоже спасибо'],
  ['*', 0, -44],
  ['r', 'Билетёру', 'За терпение'],
  ['*', -150, -40],
  ['w', 'Маме', '~Папе', 'Коту'],
  ['c', 'Свет в зале включат через минуту', { blink: 3 }],
  ['r', 'Уборка зала', '~Уже идёт'],
  ['*', 0, -62],
  ['c', 'Сцены после титров не будет'],
  ['end', 'THE END'],
];

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } },
};
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

const cv = $('cv'), ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;

// ---------- sound: a projector hum, and every word you land on plays a note ----------
const AU = { c: null, out: null, html: null, unlocked: false, muted: store.get('gtte-mute') === '1' };
const VOL = .9;
const SILENT_WAV = 'data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
function audioInit() {
  if (!AU.c) {
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      AU.c = new C();
      AU.out = AU.c.createGain();
      AU.out.gain.value = AU.muted ? 0 : VOL;
      AU.out.connect(AU.c.destination);
      const c = AU.c, len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = .8;
      const g = c.createGain(); g.gain.value = .05;
      // the shutter of a projector flutters at 24 frames a second
      const lfo = c.createOscillator(), lg = c.createGain();
      lfo.frequency.value = 24; lg.gain.value = .025;
      lfo.connect(lg); lg.connect(g.gain);
      src.connect(bp); bp.connect(g); g.connect(AU.out);
      src.start(); lfo.start();
    } catch (e) { AU.c = null; return; }
  }
  if (AU.c.state !== 'running') AU.c.resume().catch(() => {});
  if (!AU.unlocked) {
    // iPhone plays Web Audio through the ringer channel, so the silent switch mutes it,
    // unless the page asks for media playback or a media element has played once
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* not supported */ }
    try {
      AU.html = AU.html || new Audio(SILENT_WAV);
      const pr = AU.html.play();
      if (pr) pr.then(() => { AU.unlocked = true; }).catch(() => {});
    } catch (e) { /* no media element */ }
  }
}
// a finger's pointerdown is not a user gesture for Safari, so unlock sound on the events that are
for (const ev of ['pointerup', 'touchend', 'click', 'keydown']) addEventListener(ev, audioInit, { capture: true, passive: true });

// the first sounds land while the context is still waking up; hold them until it runs
function ready(fn) {
  if (!AU.c || AU.c.state === 'closed') return false;
  if (AU.c.state !== 'running') { AU.c.resume().then(fn).catch(() => {}); return false; }
  return true;
}
function tone(freq, dur = .7, vol = .14, when = 0) {
  if (!ready(() => tone(freq, dur, vol, when))) return;
  const c = AU.c, t = c.currentTime + when;
  // a few harmonics so the note survives a phone speaker
  for (const [mul, v, ty] of [[1, vol, 'sine'], [2, vol * .35, 'triangle'], [3, vol * .12, 'sine']]) {
    const o = c.createOscillator(), g = c.createGain();
    o.type = ty; o.frequency.value = freq * mul;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + .008);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AU.out); o.start(t); o.stop(t + dur + .05);
  }
}
function noise(dur = .15, vol = .2, freq = 2500, type = 'highpass') {
  if (!ready(() => noise(dur, vol, freq, type))) return;
  const c = AU.c, t = c.currentTime, len = Math.ceil(c.sampleRate * dur);
  const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = buf; f.type = type; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(AU.out); s.start(t);
}
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
const SOLFEGE = { 'До': 523.3, 'Ре': 587.3, 'Ми': 659.3, 'Фа': 698.5, 'Соль': 784, 'Ля': 880, 'Си': 987.8 };
function landNote(pl, impact) {
  const f = pl.note || 440 * Math.pow(2, PENTA[Math.floor(clamp((pl.x + pl.w / 2) / W, 0, .999) * PENTA.length)] / 12) / (pl.size >= 30 ? 2 : 1);
  tone(f, .9, .12 + .16 * impact);
}
function setMute(m) {
  AU.muted = m;
  store.set('gtte-mute', m ? '1' : '0');
  if (AU.out) AU.out.gain.value = m ? 0 : VOL;
  if (!m) tone(784, .5, .12);
  $('snd').setAttribute('aria-pressed', String(!m));
}

// ---------- layout: every word on screen is a platform ----------
let plats = [], deco = [], stars = [], checkpoints = [], endTop = 0;

function platform(text, font, size, x, base, color, extra = {}) {
  ctx.font = font;
  const fragile = text.startsWith('~');
  if (fragile) text = text.slice(1);
  const w = ctx.measureText(text).width;
  const p = { text, font, size, x, bx: x, dx: 0, w, base, top: base - size * .66, color, fragile, hold: 0, gone: false, goneT: 0, off: false, ...extra };
  if (SOLFEGE[text]) p.note = SOLFEGE[text];
  plats.push(p);
  return p;
}
function measure(text, font) { ctx.font = font; return ctx.measureText(text.replace('~', '')).width; }
function row(words, font, size, sep, y, color, extra) {
  const ws = words.map(t => measure(t, font));
  const x0 = CX - (ws.reduce((s, v) => s + v, 0) + sep * (words.length - 1)) / 2;
  let x = x0;
  const out = words.map((t, i) => { const p = platform(t, font, size, x, y, color, extra); x += ws[i] + sep; return p; });
  return { out, x0, ws };
}

function layout() {
  plats = []; deco = []; stars = []; checkpoints = [];
  let y = H * .42;
  for (const entry of CREDITS) {
    const [type, ...a] = entry;
    const opt = a.length && typeof a[a.length - 1] === 'object' ? a.pop() : {};
    const extra = {};
    if (opt.blink) Object.assign(extra, { blink: opt.blink, phase: opt.phase || 0 });
    if (opt.sway) Object.assign(extra, { sway: opt.sway, phase: opt.phase || 0 });
    if (type === '*') {
      stars.push({ x: CX + a[0], y: y + a[1], got: false, banked: false });
    } else if (type === 'title') {
      // the title is four separate words, the gaps between them are the first way down
      const { out, x0, ws } = row(a[0].split(' '), `600 40px ${SERIF}`, 40, 20, y, FILM, { glow: true });
      checkpoints.push({ name: 'Начало', top: out[0].top, x: x0 + ws[0] / 2 });
      y += LINE * 1.6;
    } else if (type === 'h') {
      y += LINE * .45;
      const text = a[0].toUpperCase(), font = `italic 600 30px ${SERIF}`;
      const p = platform(text, font, 30, CX - measure(text, font) / 2, y, FILM);
      checkpoints.push({ name: a[0], top: p.top, x: CX });
      y += LINE * 1.15;
    } else if (type === 'r') {
      const rf = `600 14px ${SERIF}`, nf = `500 24px ${SERIF}`, role = a[0].toUpperCase();
      platform(role, rf, 14, CX - 18 - measure(role, rf), y, DIM, extra);
      platform(a[1], nf, 24, CX + 18, y, FILM, extra);
      y += LINE;
    } else if (type === 'c') {
      // a sentence: every word stands apart, so there is always a gap to drop through
      const fragile = a[0].startsWith('~');
      row(a[0].replace('~', '').split(' ').map(t => (fragile ? '~' : '') + t), `italic 500 22px ${SERIF}`, 22, 16, y, FILM, extra);
      y += LINE;
    } else if (type === 'w') {
      const { out } = row(a, `500 22px ${SERIF}`, 22, 34, y, FILM, extra);
      out.slice(0, -1).forEach(p => deco.push({ text: '·', font: p.font, x: p.x + p.w + 14, base: y, color: DIM }));
      y += LINE;
    } else if (type === 'end') {
      y += LINE * 1.2;
      const { out } = row(a[0].split(' '), `600 84px ${SERIF}`, 84, 34, y, FILM, { end: true, glow: true });
      endTop = out[0].top;
    }
  }
}

// ---------- modes, records, the ghost of your best take ----------
let hard = store.get('gtte-hard') === '1' && store.get('gtte-won') === '1';
const bestKey = () => hard ? 'gtte-credits-best-dc' : 'gtte-credits-best';
const ghostKey = () => hard ? 'gtte-ghost-dc' : 'gtte-ghost';
function loadGhost() {
  try { const g = JSON.parse(store.get(ghostKey()) || 'null'); return Array.isArray(g) ? g : null; } catch (e) { return null; }
}

// ---------- state ----------
let S;
const keys = { left: false, right: false, jump: false };

function reset() {
  layout();
  const cp = checkpoints[0];
  S = {
    mode: 'title', camY: 0, time: 0, clock: 0, take: 1, cp: 0, cutT: 0, cutWhy: '', wonT: 0, pauseFrom: null,
    burn: null, parts: [], rec: [], recT: 0, ghost: loadGhost(), all: false,
    p: { x: cp.x - PW / 2, y: cp.top - PH, vx: 0, vy: 0, ground: null, coyote: 0, buffer: 0, trail: [], squash: 0 },
  };
  hud();
}

function begin() {
  if (S.mode !== 'title') return;
  S.mode = 'play';
  $('dc').disabled = true;
  tone(392, 1.4, .14);
  hud();
}

function respawn() {
  const cp = checkpoints[S.cp];
  for (const pl of plats) if (pl.top >= cp.top - 1) { pl.gone = false; pl.hold = 0; pl.goneT = 0; }
  for (const s of stars) if (!s.banked) s.got = false;
  S.camY = Math.max(0, cp.top - H * .4);
  Object.assign(S.p, { x: cp.x - PW / 2, y: cp.top - PH, vx: 0, vy: 0, ground: null, coyote: 0, buffer: 0, trail: [], squash: 0 });
  S.mode = 'play';
  hud();
}

function cut(why) {
  S.mode = 'cut'; S.cutT = 0; S.cutWhy = why; S.take++;
  S.burn = { x: S.p.x + PW / 2, y: clamp(S.p.y - S.camY, 0, H) };
  noise(.5, .45, 900, 'lowpass');
  noise(.05, .3, 3000);
  hud();
}

function win() {
  S.mode = 'won'; S.wonT = 0;
  S.all = stars.every(s => s.got);
  store.set('gtte-won', '1');
  if (S.all) store.set('gtte-post', '1');
  const best = +(store.get(bestKey()) || 0);
  if (!best || S.time < best) {
    store.set(bestKey(), S.time.toFixed(2));
    store.set(ghostKey(), JSON.stringify(S.rec));
  }
  [261.6, 329.6, 392, 523.3].forEach((f, i) => tone(f, 2.6, .07, i * .12));
  $('dc').hidden = false;
  hud();
}

function burst(x, y, n, color, speed = 120) {
  if (REDUCED) n = Math.min(n, 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = speed * (.3 + Math.random() * .7);
    S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: .5 + Math.random() * .4, t: 0, color });
  }
}

// ---------- update ----------
function update(dt) {
  const p = S.p;
  if (S.mode === 'pause') return;
  for (const pl of plats) if (pl.gone && pl.goneT < 1) pl.goneT += dt * 1.4;
  S.parts = S.parts.filter(q => (q.t += dt) < q.life);
  for (const q of S.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 500 * dt; }
  if (S.mode === 'cut') { S.cutT += dt; if (S.cutT > 1.45) respawn(); return; }
  if (S.mode === 'title') return;
  if (S.mode === 'won') S.wonT += dt;
  S.clock += dt;

  // moving and blinking lines
  for (const pl of plats) {
    if (pl.sway) { const nx = pl.bx + pl.sway * Math.sin(S.clock * 1.2 + pl.phase); pl.dx = nx - pl.x; pl.x = nx; }
    if (pl.blink) pl.off = (S.clock + pl.phase) % pl.blink > pl.blink * .7;
  }

  if (S.mode === 'play') {
    S.time += dt;
    // credits roll faster the closer you get to the end, and stop once THE END is in the frame
    const k = clamp(S.camY / (endTop || 1), 0, 1);
    S.camY = Math.min(S.camY + (34 + 40 * k) * (hard ? 1.45 : 1) * dt, endTop - H * .6);
  }

  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const target = S.mode === 'won' ? 0 : dir * RUN;
  p.vx += clamp(target - p.vx, -ACC * dt, ACC * dt);
  p.coyote = p.ground ? .09 : Math.max(0, p.coyote - dt);
  p.buffer = Math.max(0, p.buffer - dt);
  if (p.buffer > 0 && p.coyote > 0 && S.mode === 'play') {
    p.vy = -JUMP; p.buffer = 0; p.coyote = 0; p.ground = null;
  }
  p.vy = Math.min(MAXFALL, p.vy + GRAV * dt);

  // a swaying line carries whoever stands on it
  if (p.ground && p.ground.sway) p.x += p.ground.dx;
  const prevGround = p.ground, impact = p.vy;
  const prevBottom = p.y + PH;
  p.x = clamp(p.x + p.vx * dt, 0, W - PW);
  p.y += p.vy * dt;

  // one-way platforms: land on a word only while falling onto its top
  p.ground = null;
  if (p.vy >= 0) {
    let best = null;
    for (const pl of plats) {
      if (pl.gone || pl.off || p.x + PW <= pl.x || p.x >= pl.x + pl.w) continue;
      if (prevBottom <= pl.top + .5 && p.y + PH >= pl.top && (!best || pl.top < best.top)) best = pl;
    }
    if (best) {
      p.y = best.top - PH; p.vy = 0; p.ground = best;
      if (!prevGround) {
        const k = clamp(impact / MAXFALL, 0, 1);
        p.squash = .3 + .7 * k;
        landNote(best, k);
        if (k > .45) burst(p.x + PW / 2, p.y + PH, 4, DIM, 60);
      }
    }
  }
  p.squash = Math.max(0, p.squash - dt * 6);

  if (p.ground && p.ground.fragile) {
    p.ground.hold += dt;
    if (p.ground.hold > (hard ? .38 : .55)) {
      p.ground.gone = true; p.ground = null;
      noise(.18, .18, 1800);
    }
  }
  if (p.ground && p.ground.end && S.mode === 'play') win();

  for (let i = S.cp + 1; i < checkpoints.length; i++) if (p.y > checkpoints[i].top) {
    S.cp = i;
    for (const s of stars) if (s.got) s.banked = true;
    tone(523.3, 1.2, .1);
    hud();
  }

  if (S.mode === 'play') {
    const cx = p.x + PW / 2, cy = p.y + PH / 2;
    for (const s of stars) if (!s.got && Math.hypot(s.x - cx, s.y - cy) < 15) {
      s.got = true;
      burst(s.x, s.y, 10, FILM, 140);
      tone(1318.5, .5, .06); tone(1975.5, .7, .05, .08);
      hud();
    }
  }

  p.trail.unshift({ x: p.x + PW / 2, y: p.y + PH / 2 });
  if (p.trail.length > 10) p.trail.pop();

  if (S.mode === 'play') {
    while (S.recT <= S.time) { S.rec.push(Math.round(p.x), Math.round(p.y)); S.recT += 1 / REC_HZ; }
    // the camera chases a falling dot, but slower than it falls: a short slip is forgiven, a long drop is not
    const low = p.y - S.camY - H * .68;
    if (low > 0) S.camY = Math.min(S.camY + Math.min(low, (hard ? 40 : 140) * dt), endTop - H * .6);
    const sy = p.y - S.camY;
    if (sy + PH < -2) cut('Тебя унесло за верх кадра');
    else if (sy > H + 2) cut('Ты выпал из кадра');
  }
}

// ---------- render ----------
const grain = document.createElement('canvas');
grain.width = grain.height = 160;
{
  const g = grain.getContext('2d'), img = g.createImageData(160, 160);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
}
const grainPat = ctx.createPattern(grain, 'repeat');

function drawText(pl, alpha, dy = 0, jitter = 0) {
  ctx.globalAlpha = alpha;
  ctx.font = pl.font;
  ctx.fillStyle = pl.color;
  ctx.fillText(pl.text, pl.x + jitter, pl.base + dy);
}

function render(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  const p = S.p, cam = S.camY;
  const flick = REDUCED || S.mode === 'pause' ? 1 : .94 + .06 * Math.random();
  const wonFade = S.mode === 'won' ? clamp(S.wonT / 1.6, 0, 1) : 0;

  ctx.save();
  ctx.translate(0, -cam);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (const d of deco) {
    if (d.base - cam < -40 || d.base - cam > H + 100) continue;
    ctx.globalAlpha = .8 * flick * (1 - wonFade); ctx.font = d.font; ctx.fillStyle = d.color; ctx.fillText(d.text, d.x, d.base);
  }
  for (const pl of plats) {
    const sy = pl.base - cam;
    if (sy < -40 || sy > H + 120) continue;
    let a = flick * (pl.end ? 1 : 1 - wonFade);
    if (pl.gone) {
      if (pl.goneT >= 1) continue;
      drawText(pl, a * (1 - pl.goneT), pl.goneT * pl.goneT * 160);
      continue;
    }
    if (pl.blink) {
      // a dying bulb: stutters just before it goes dark
      const ph = (S.clock + pl.phase) % pl.blink;
      if (pl.off) a *= .12;
      else if (ph > pl.blink * .55 && !REDUCED) a *= Math.random() < .5 ? .35 : 1;
    }
    const standing = p.ground === pl;
    const shake = pl.fragile && pl.hold > 0 && !REDUCED ? (Math.random() - .5) * 3 * (pl.hold / .55) : 0;
    if (pl.fragile) a *= .62 + .1 * Math.sin(t * .006 + pl.x);
    if (pl.glow || standing) { ctx.shadowColor = 'rgba(255,240,210,.55)'; ctx.shadowBlur = standing ? 14 : 18; }
    drawText(pl, a, 0, shake);
    ctx.shadowBlur = 0;
    if (pl.fragile) {
      // a dashed hairline under a name that will not hold you for long
      ctx.globalAlpha = a * .5; ctx.fillStyle = DIM;
      for (let x = pl.x; x < pl.x + pl.w; x += 6) ctx.fillRect(x + shake, pl.base + 5, 3, 1);
    }
  }

  // stars of the film
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const s of stars) {
    if (s.got || s.y - cam < -30 || s.y - cam > H + 30) continue;
    const bob = REDUCED ? 0 : Math.sin(t * .003 + s.x) * 2.5;
    ctx.globalAlpha = (.75 + .25 * Math.sin(t * .006 + s.y)) * (1 - wonFade);
    ctx.font = `500 20px ${SERIF}`;
    ctx.fillStyle = '#fff6df'; ctx.shadowColor = 'rgba(255,236,190,.9)'; ctx.shadowBlur = 14;
    ctx.fillText('★', s.x, s.y + bob);
    ctx.shadowBlur = 0;
  }

  // the ghost of your best take
  if (S.ghost && (S.mode === 'play' || S.mode === 'cut')) {
    const i = Math.floor(S.time * REC_HZ) * 2;
    if (i + 1 < S.ghost.length) {
      ctx.globalAlpha = .35; ctx.strokeStyle = FILM; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(S.ghost[i] + PW / 2, S.ghost[i + 1] + PH / 2, 5, 0, Math.PI * 2); ctx.stroke();
    }
  }

  for (const q of S.parts) {
    ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.color;
    ctx.fillRect(q.x - 1, q.y - 1, 2, 2);
  }
  ctx.globalAlpha = 1;

  // the dot
  if (S.mode !== 'cut') {
    p.trail.forEach((q, i) => {
      ctx.globalAlpha = .25 * (1 - i / p.trail.length);
      ctx.fillStyle = FILM;
      ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(1, 4 - i * .3), 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    const sq = p.squash;
    ctx.shadowColor = '#fff3d6'; ctx.shadowBlur = 16; ctx.fillStyle = '#fffaf0';
    ctx.beginPath(); ctx.ellipse(p.x + PW / 2, p.y + PH / 2 + sq * 2, 5 * (1 + .45 * sq), 5 * (1 - .4 * sq), 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.restore();

  // frame edges warm up red as you drift towards them
  if (S.mode === 'play') {
    const sy = p.y - cam;
    const top = clamp(1 - sy / 140, 0, 1), bot = clamp(1 - (H - sy - PH) / 140, 0, 1);
    if (top > 0) { const g = ctx.createLinearGradient(0, 0, 0, 90); g.addColorStop(0, `rgba(255,74,61,${.45 * top})`); g.addColorStop(1, 'rgba(255,74,61,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 90); }
    if (bot > 0) { const g = ctx.createLinearGradient(0, H, 0, H - 90); g.addColorStop(0, `rgba(255,74,61,${.45 * bot})`); g.addColorStop(1, 'rgba(255,74,61,0)'); ctx.fillStyle = g; ctx.fillRect(0, H - 90, W, 90); }
  }

  // film grain, a stray scratch and the vignette
  ctx.save();
  ctx.globalAlpha = .07;
  ctx.globalCompositeOperation = 'screen';
  if (S.mode !== 'pause') ctx.translate(Math.random() * 160, Math.random() * 160);
  ctx.fillStyle = grainPat; ctx.fillRect(-160, -160, W + 320, H + 320);
  ctx.restore();
  if (!REDUCED && S.mode !== 'pause' && Math.random() < .02) { ctx.fillStyle = 'rgba(239,232,220,.18)'; ctx.fillRect(Math.random() * W, 0, 1, H); }
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.7)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  if (S.mode === 'title') {
    const band = ctx.createLinearGradient(0, H - 170, 0, H);
    band.addColorStop(0, 'rgba(0,0,0,0)'); band.addColorStop(.4, 'rgba(0,0,0,.92)'); band.addColorStop(1, '#000');
    ctx.fillStyle = band; ctx.fillRect(0, H - 170, W, 170);
    ctx.globalAlpha = .55 + .45 * Math.abs(Math.sin(t * .0022));
    ctx.font = `500 12px ${MONO}`; ctx.fillStyle = hard ? CUT : DIM;
    ctx.fillText(hard ? 'РЕЖИССЁРСКАЯ ВЕРСИЯ · ПРОБЕЛ — НАЧАТЬ' : 'ПРОБЕЛ ИЛИ КАСАНИЕ — НАЧАТЬ СЕАНС', CX, H - 76);
    ctx.globalAlpha = .7; ctx.fillStyle = DIM;
    ctx.fillText('титры поедут вверх · держись в кадре · дойди до конца', CX, H - 54);
    ctx.fillText(`★ звёзды фильма: ${stars.length}. Собери все.`, CX, H - 34);
    ctx.globalAlpha = 1;
  }
  if (S.mode === 'cut') drawCut();
  if (S.mode === 'won') drawWon();
  if (S.mode === 'pause') {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = FILM; ctx.font = `italic 500 44px ${SERIF}`;
    ctx.fillText('Пауза', CX, H / 2 - 6);
    ctx.font = `500 12px ${MONO}`; ctx.fillStyle = DIM;
    ctx.fillText('ПЛЁНКА ОСТАНОВЛЕНА · P — ПРОДОЛЖИТЬ', CX, H / 2 + 24);
  }
}

// a frame stuck in the gate melts from the dot outward, then the slate
function drawCut() {
  const T = S.cutT, b = S.burn;
  if (b && T < .55) {
    const r = 30 + (T / .55) * 900;
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(.55, 'rgba(0,0,0,1)');
    g.addColorStop(.7, 'rgba(255,248,225,.95)');
    g.addColorStop(.82, 'rgba(255,150,50,.85)');
    g.addColorStop(.92, 'rgba(120,30,0,.5)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  } else {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  }
  const k = clamp((T - .45) / .2, 0, 1);
  if (k <= 0) return;
  ctx.globalAlpha = k;
  ctx.fillStyle = FILM; ctx.font = `italic 600 64px ${SERIF}`;
  ctx.fillText('Стоп. Снято.', CX, H / 2 - 10);
  ctx.font = `500 13px ${MONO}`; ctx.fillStyle = DIM;
  ctx.fillText(S.cutWhy.toUpperCase(), CX, H / 2 + 26);
  ctx.fillStyle = CUT;
  ctx.fillText(`ДУБЛЬ ${S.take}`, CX, H / 2 + 52);
  ctx.globalAlpha = 1;
}

function drawWon() {
  const T = S.wonT, got = stars.filter(s => s.got).length;
  if (S.all && T > 3) {
    // the post-credits scene that was promised not to exist: the house lights come up
    const L = clamp((T - 3) / 2.2, 0, 1);
    ctx.fillStyle = `rgba(242,234,220,${L})`; ctx.fillRect(0, 0, W, H);
    const k = clamp((T - 4.6) / 1.2, 0, 1);
    ctx.globalAlpha = k;
    ctx.fillStyle = '#7a7166'; ctx.font = `500 11px ${MONO}`;
    ctx.fillText('СЦЕНА ПОСЛЕ ТИТРОВ', CX, H * .3);
    ctx.fillStyle = '#1a1416'; ctx.font = `italic 500 34px ${SERIF}`;
    ctx.fillText('Свет в зале включили.', CX, H * .3 + 50);
    ctx.font = `italic 500 24px ${SERIF}`;
    ctx.fillText('Ты встаёшь и выходишь на улицу.', CX, H * .3 + 96);
    ctx.fillText('Там светло. И это ещё не конец.', CX, H * .3 + 130);
    ctx.fillStyle = '#7a7166'; ctx.font = `500 12px ${MONO}`;
    ctx.fillText(`ВРЕМЯ ${fmt(S.time)} · ДУБЛЕЙ ${S.take} · ★ ${got}/${stars.length}`, CX, H * .3 + 180);
    if (T > 6.5) ctx.fillText('ПРОБЕЛ ИЛИ КАСАНИЕ — ЕЩЁ ОДИН СЕАНС', CX, H - 48);
    ctx.globalAlpha = 1;
    return;
  }
  if (T < 1.2) return;
  const k = clamp((T - 1.2) / 1, 0, 1);
  ctx.globalAlpha = k;
  ctx.font = `italic 500 26px ${SERIF}`; ctx.fillStyle = FILM;
  ctx.fillText('Спасибо за просмотр', CX, H * .22);
  ctx.font = `500 12px ${MONO}`; ctx.fillStyle = DIM;
  ctx.fillText(`ВРЕМЯ ${fmt(S.time)} · ДУБЛЕЙ ${S.take} · ★ ${got}/${stars.length}`, CX, H * .22 + 30);
  if (!S.all) ctx.fillText('собери все звёзды — и, может быть, сцена после титров будет', CX, H * .22 + 52);
  if (T > 2.4) ctx.fillText('ПРОБЕЛ ИЛИ КАСАНИЕ — ЕЩЁ ОДИН СЕАНС', CX, H - 48);
  ctx.globalAlpha = 1;
}

// ---------- hud ----------
function hud() {
  $('take').textContent = S.take;
  $('scene').textContent = S.mode === 'won' ? 'Конец' : checkpoints[S.cp].name;
  $('time').textContent = fmt(S.time);
  $('stars').textContent = `${stars.filter(s => s.got).length} / ${stars.length}`;
  const best = +(store.get(bestKey()) || 0);
  $('best').textContent = best ? fmt(best) : '—';
  $('dc').hidden = store.get('gtte-won') !== '1';
  $('dc').disabled = S.mode !== 'title' && S.mode !== 'won';
  $('dc').setAttribute('aria-pressed', String(hard));
  $('pause').setAttribute('aria-pressed', String(S.mode === 'pause'));
}

// ---------- loop ----------
let last = performance.now(), lastSec = -1;
function frame(t) {
  const dt = Math.min(1 / 30, Math.max(0, (t - last) / 1000)); last = t;
  update(dt);
  render(t);
  const sec = Math.floor(S.time);
  if (sec !== lastSec) { lastSec = sec; $('time').textContent = fmt(S.time); }
  requestAnimationFrame(frame);
}

// ---------- input ----------
function togglePause(force) {
  if (S.mode === 'pause' && force !== true) { S.mode = S.pauseFrom; S.pauseFrom = null; }
  else if (S.mode === 'play' || S.mode === 'cut') { S.pauseFrom = S.mode; S.mode = 'pause'; keys.left = keys.right = keys.jump = false; }
  hud();
}
function press(k) {
  audioInit();
  if (S.mode === 'pause') { togglePause(); return; }
  if (S.mode === 'title') { begin(); return; }
  if (S.mode === 'won') { if (S.wonT > (S.all ? 6.5 : 2.4)) { reset(); begin(); } return; }
  if (k === 'jump') S.p.buffer = .12;
}
const MAP = {
  ArrowLeft: 'left', a: 'left', 'ф': 'left',
  ArrowRight: 'right', d: 'right', 'в': 'right',
  ' ': 'jump', ArrowUp: 'jump', w: 'jump', 'ц': 'jump', Enter: 'jump',
};
const keyOf = e => MAP[e.key.length === 1 ? e.key.toLowerCase() : e.key];
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const ch = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (ch === 'm' || ch === 'ь') { audioInit(); setMute(!AU.muted); return; }
  if (ch === 'p' || ch === 'з' || ch === 'Escape') { e.preventDefault(); togglePause(); return; }
  const k = keyOf(e);
  if (!k) return;
  e.preventDefault();
  if (e.repeat) return;
  keys[k] = true;
  press(k);
});
addEventListener('keyup', e => {
  const k = keyOf(e);
  if (!k) return;
  keys[k] = false;
  // a short tap gives a short hop
  if (k === 'jump' && S.p.vy < 0) S.p.vy *= .5;
});
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; if (S.mode === 'play') togglePause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S.mode === 'play') togglePause(true); });
cv.addEventListener('pointerdown', () => { if (S.mode === 'title' || S.mode === 'won' || S.mode === 'pause') press('jump'); });
for (const b of $('pads').querySelectorAll('button')) {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); keys[k] = true; b.classList.add('on'); press(k); };
  const up = () => { keys[k] = false; b.classList.remove('on'); if (k === 'jump' && S.p.vy < 0) S.p.vy *= .5; };
  b.addEventListener('pointerdown', down);
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, up);
}
$('snd').addEventListener('click', () => { audioInit(); setMute(!AU.muted); });
$('pause').addEventListener('click', () => togglePause());
$('dc').addEventListener('click', () => {
  if (S.mode !== 'title' && S.mode !== 'won') return;
  hard = !hard;
  store.set('gtte-hard', hard ? '1' : '0');
  reset();
});

// ---------- boot: re-measure the words once the typeface arrives ----------
const fontsReady = Promise.race([
  Promise.all([`600 40px ${SERIF}`, `italic 600 30px ${SERIF}`, `500 24px ${SERIF}`, `italic 500 22px ${SERIF}`].map(f => document.fonts.load(f))),
  new Promise(r => setTimeout(r, 1500)),
]).catch(() => {});
setMute(AU.muted);
reset();
requestAnimationFrame(frame);
fontsReady.then(() => { if (S.mode === 'title') reset(); });
})();
</script>
</body>
</html>
