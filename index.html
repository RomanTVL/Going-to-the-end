  --hall: #050405;

  --seat: #1c1719;
  --seat-edge: #2c2427;
  --cut: #ff4a3d;
  --f-film: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-slate: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(70% 50% at 50% 30%, #151012 0%, var(--hall) 70%) fixed, var(--hall);
  color: var(--film);
  font-family: var(--f-slate);
  font-size: 13px;
}
.hall {
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen {
  width: min(100%, calc((100dvh - 210px) * 0.8), 560px);
  min-width: min(260px, 100%);
  aspect-ratio: 4 / 5;
  background: var(--screen);
  box-shadow: 0 0 0 1px #201a1c, 0 0 80px rgba(239, 232, 220, .07), 0 40px 120px -40px rgba(239, 232, 220, .18);
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.slate {
  width: min(100%, 560px);
  margin: 0;
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px;
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.slate b { color: var(--film); font-weight: 500; }
.slate b.late { color: var(--cut); }
.toggles { justify-content: flex-start; gap: 8px; }
.toggle {
  font: 500 11px var(--f-slate); letter-spacing: .14em; text-transform: uppercase;
  color: var(--dim); background: transparent; border: 1px solid var(--seat-edge);
  padding: 6px 10px; cursor: pointer;
}
.toggle:hover { color: var(--film); border-color: var(--dim); }
.toggle[aria-pressed="true"] { color: var(--film); border-color: var(--film); }
.hint { color: #6a625b; letter-spacing: .08em; justify-content: center; text-align: center; text-transform: none; }
.pads { display: none; gap: 10px; width: min(100%, 560px); }
.pads button {
  flex: 1; height: 58px; font: 500 20px var(--f-slate); color: var(--film);
  background: var(--seat); border: 1px solid var(--seat-edge); border-radius: 0;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
.pads button.on { background: var(--seat-edge); border-color: var(--film); }
.pads .jump { flex: 1.4; }
button:focus-visible { outline: 2px solid var(--film); outline-offset: 2px; }
@media (pointer: coarse) { .pads { display: flex; } .hint { display: none; } }

function landNote(pl, impact) {
  const base = LV.sound.base * (LV.sound.base < 300 ? 2 : 1);
  const f = pl.note || base * Math.pow(2, PENTA[Math.floor(clamp((pl.x + pl.w / 2) / W, 0, .999) * PENTA.length)] / 12) / (pl.size >= 30 ? 2 : 1);
  tone(f, .9, .12 + .16 * impact, 0, LV.sound.wave);
}
function setMute(m) {
  AU.muted = m;
  store.set('gtte-mute', m ? '1' : '0');
  if (AU.out) AU.out.gain.value = m ? 0 : VOL;
  if (!m) tone(784, .5, .12);
  $('snd').setAttribute('aria-pressed', String(!m));
}

// ---------- layout: every word on screen is a platform ----------
let LV = LEVELS[0];
let plats = [], deco = [], stars = [], checkpoints = [], props = [], endTop = 0;

function platform(text, font, size, x, base, color, extra = {}) {
  ctx.font = font;
  const fragile = text.startsWith('~');
  if (fragile) text = text.slice(1);
  const w = ctx.measureText(text).width;
  const p = { text, font, size, x, bx: x, dx: 0, w, base, top: base - size * LV.cap, color, fragile, hold: 0, gone: false, goneT: 0, off: false, ...extra };
  if (SOLFEGE[text]) p.note = SOLFEGE[text];
  plats.push(p);
  return p;
}
function measure(text, font) { ctx.font = font; return ctx.measureText(text.replace('~', '')).width; }
function row(words, [font, size, sep], y, color, extra) {
  const ws = words.map(t => measure(t, font));
  const x0 = CX - (ws.reduce((s, v) => s + v, 0) + sep * (words.length - 1)) / 2;
  let x = x0;
  const out = words.map((t, i) => { const p = platform(t, font, size, x, y, color, extra); x += ws[i] + sep; return p; });
  return { out, x0, ws };
}

function layout() {
  plats = []; deco = []; stars = []; checkpoints = []; props = [];
  const f = LV.fonts, P = LV.pal;
  let y = H * .42;
  for (const entry of LV.credits) {
    const [type, ...a] = entry;
    const opt = a.length && typeof a[a.length - 1] === 'object' ? a.pop() : {};
    const extra = {};
    if (opt.blink) Object.assign(extra, { blink: opt.blink, phase: opt.phase || 0 });
    if (opt.sway) Object.assign(extra, { sway: opt.sway, phase: opt.phase || 0 });
    if (type === '*') {
      stars.push({ x: CX + a[0], y: y + a[1], got: false, banked: false });
    } else if (type === 'title') {
      // the title is separate words, the gaps between them are the first way down
      const { out, x0, ws } = row(a[0].split(' '), f.title, y, P.film, { glow: true });
      checkpoints.push({ name: 'Начало', top: out[0].top, x: x0 + ws[0] / 2 });
      y += LINE * 1.6;
    } else if (type === 'h') {
      y += LINE * .45;
      const text = a[0].toUpperCase();
      const p = platform(text, f.head[0], f.head[1], CX - measure(text, f.head[0]) / 2, y, P.film);
      checkpoints.push({ name: a[0], top: p.top, x: CX });
      y += LINE * 1.15;
    } else if (type === 'r') {
      const role = a[0].toUpperCase();
      platform(role, f.role[0], f.role[1], CX - 18 - measure(role, f.role[0]), y, P.dim, extra);
      platform(a[1], f.name[0], f.name[1], CX + 18, y, P.film, extra);
      y += LINE;
    } else if (type === 'c') {
      // a sentence: every word stands apart, so there is always a gap to drop through
      const fragile = a[0].startsWith('~');
      row(a[0].replace('~', '').split(' ').map(t => (fragile ? '~' : '') + t), f.sent, y, P.film, extra);
      y += LINE;
    } else if (type === 'w') {
      const { out } = row(a, f.list, y, P.film, extra);
      out.slice(0, -1).forEach(p => deco.push({ text: '·', font: p.font, x: p.x + p.w + f.list[2] / 2 - 3, base: y, color: P.dim }));
      y += LINE;
    } else if (type === 'end') {
      y += LINE * 1.2;
      const { out } = row(a[0].split(' '), [f.end[0], f.end[1], 34], y, P.film, { end: true, glow: true });
      endTop = out[0].top;
    }
  }
  // decorations live in the margins, alternating sides
  let side = Math.random() < .5 ? 0 : 1;
  for (let py = H * .42 + 170, i = 0; py < endTop - 60 && LV.props.length; py += 220 + Math.random() * 170, i++) {
    side ^= 1;
    props.push({ kind: LV.props[i % LV.props.length], x: side ? 478 + Math.random() * 34 : 28 + Math.random() * 34, y: py, s: .8 + Math.random() * .45, ph: Math.random() * 6, side });
  }
}

// how long the credits take to roll by themselves; the level timer asks for a bit better than that
function parFor() {
  let cam = 0, t = 0;
  const stop = endTop - H * .6, dt = 1 / 30;
  while (cam < stop && t < 900) { cam += (34 + 40 * clamp(cam / endTop, 0, 1)) * (LV.speed || 1) * dt; t += dt; }
  return Math.ceil(t * .85 / 5) * 5;
}

// ---------- the run: four sessions in a row, judged at the very end ----------
const freshRun = () => ({ li: 0, res: [] });
let RUN = store.json('gtte-run');
if (!RUN || typeof RUN.li !== 'number' || RUN.li >= LEVELS.length || !Array.isArray(RUN.res)) RUN = freshRun();
const saveRun = () => store.set('gtte-run', JSON.stringify(RUN));
const seenEndings = () => store.json('gtte-endings') || [];

// ---------- state ----------
let S;
const keys = { left: false, right: false, jump: false };

function startLevel(i, mode = 'intro') {
  LV = LEVELS[i];
  layout();
  const cp = checkpoints[0];
  S = {
    mode, li: i, camY: 0, time: 0, clock: 0, take: 1, cp: 0, cutT: 0, cutWhy: '', modeT: 0, pauseFrom: null,
    burn: null, parts: [], rec: [], recT: 0, ghost: store.json('gtte-ghost-' + LV.key), par: parFor(),
    hz: [], hzT: 2, amb: makeAmbient(), cues: new Set(), ending: null,
    p: { x: cp.x - PW / 2, y: cp.top - PH, vx: 0, vy: 0, ground: null, coyote: 0, buffer: 0, trail: [], squash: 0 },
  };
  hud();
}

function makeAmbient() {
  if (LV.key === 'hollow') return {
    flies: Array.from({ length: 5 }, () => ({ bx: 60 + Math.random() * 420, by: 80 + Math.random() * 500, ph: Math.random() * 6, sp: .7 + Math.random() * .6 })),
    motes: Array.from({ length: 28 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 8 + Math.random() * 16 })),
  };
  if (LV.key === 'orbit') return { field: Array.from({ length: 110 }, () => ({ x: Math.random() * W, y: Math.random() * H, d: .05 + Math.random() * .35, r: Math.random() < .1 ? 1.6 : .9 })) };
  return {};
}

function play() {
  if (S.mode !== 'intro' && S.mode !== 'menu') return;
  S.mode = 'play'; S.modeT = 0;
  tone(392, 1.4, .14);
  hud();
}

function respawn() {
  const cp = checkpoints[S.cp];
  for (const pl of plats) if (pl.top >= cp.top - 1) { pl.gone = false; pl.hold = 0; pl.goneT = 0; }
  for (const s of stars) if (!s.banked) s.got = false;
  S.hz = []; S.hzT = 1.5;
  S.camY = Math.max(0, cp.top - H * .4);
  Object.assign(S.p, { x: cp.x - PW / 2, y: cp.top - PH, vx: 0, vy: 0, ground: null, coyote: 0, buffer: 0, trail: [], squash: 0 });
  S.mode = 'play';
  hud();
}

function cut(why) {
  S.mode = 'cut'; S.cutT = 0; S.cutWhy = why; S.take++;
  S.burn = { x: S.p.x + PW / 2, y: clamp(S.p.y - S.camY, 0, H) };
  noise(.5, .45, 900, 'lowpass');
  noise(.05, .3, 3000);
  hud();
}

function finishLevel() {
  const got = stars.filter(s => s.got).length;
  RUN.res[S.li] = { t: +S.time.toFixed(2), par: S.par, got, total: stars.length };
  const best = store.json('gtte-best-' + LV.key);
  if (!best || S.time < best) {
    store.set('gtte-best-' + LV.key, S.time.toFixed(2));
    store.set('gtte-ghost-' + LV.key, JSON.stringify(S.rec));
  }
  if (LV.final) {
    S.mode = 'ending'; S.modeT = 0; S.ending = judge();
    const seen = seenEndings();
    if (!seen.includes(S.ending)) store.set('gtte-endings', JSON.stringify([...seen, S.ending]));
    RUN = freshRun();
  } else {
    S.mode = 'clear'; S.modeT = 0;
    RUN.li = S.li + 1;
    [523.3, 659.3, 784].forEach((f, i) => tone(f, 1.6, .08, i * .1));
  }
  saveRun();
  hud();
}

// the verdict on the whole evening
function judge() {
  const res = RUN.res, fast = res.every(r => r.t <= r.par);
  const got = res.reduce((s, r) => s + r.got, 0), total = res.reduce((s, r) => s + r.total, 0);
  const pct = total ? got / total : 0;
  S.summary = { fast, got, total, time: res.reduce((s, r) => s + r.t, 0), inTime: res.filter(r => r.t <= r.par).length };
  if (fast && got === total) return 'full';
  if (fast && pct >= .5) return 'almost';
  if (!fast && pct < .5) return 'truck';
  return fast ? 'blind' : 'late';
}

function burst(x, y, n, color, speed = 120) {
  if (REDUCED) n = Math.min(n, 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = speed * (.3 + Math.random() * .7);
    S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: .5 + Math.random() * .4, t: 0, color });
  }
}

// ---------- hazards: each film throws something of its own ----------
function spawnHazard() {
  const p = S.p, cx = p.x + PW / 2, cy = p.y + PH / 2;
  if (LV.hazard === 'bullet') {
    const fromL = Math.random() < .5;
    S.hz.push({ type: 'bullet', x: fromL ? -20 : W + 20, y: cy + pick([0, 0, -36, 36]), vx: fromL ? 560 : -560, warn: .95, t: 0, why: 'Тебя застрелили' });
  } else if (LV.hazard === 'nail') {
    S.hz.push({ type: 'nail', x: clamp(cx + Math.random() * 90 - 45, 16, W - 16), y: 0, vy: 140, warn: .8, t: 0, why: 'Гвоздь достал тебя' });
  } else if (LV.hazard === 'meteor') {
    const fromL = Math.random() < .5, sx = fromL ? -20 : W + 20, sy = S.camY + 20 + Math.random() * 120;
    const tx = cx + Math.random() * 40 - 20, ty = cy, d = Math.hypot(tx - sx, ty - sy) || 1;
    S.hz.push({ type: 'meteor', x: sx, y: sy, vx: (tx - sx) / d * 290, vy: (ty - sy) / d * 290, warn: .75, t: 0, why: 'В тебя попал метеорит' });
  }
}

function updateHazards(dt) {
  if (!LV.hazard) return;
  if (S.mode === 'play') {
    S.hzT -= dt;
    if (S.time > 2.5 && S.hzT <= 0) {
      spawnHazard();
      S.hzT = 2.5 - 1.1 * clamp(S.camY / endTop, 0, 1) + Math.random() * .7;
    }
  }
  for (const h of S.hz) {
    h.t += dt;
    if (h.t < h.warn) continue;
    if (!h.live) {
      h.live = true;
      if (h.type === 'bullet') noise(.09, .35, 1200);
      if (h.type === 'nail') { h.y = S.camY - 40; tone(1760, .25, .05); }
      if (h.type === 'meteor') noise(.4, .15, 500, 'lowpass');
    }
    if (h.type === 'nail') { h.vy += 1500 * dt; h.y += h.vy * dt; }
    else { h.x += h.vx * dt; h.y += (h.vy || 0) * dt; }
  }
  if (S.mode === 'play') {
    const cx = S.p.x + PW / 2, cy = S.p.y + PH / 2;
    for (const h of S.hz) {
      if (!h.live) continue;
      const hit = h.type === 'bullet' ? Math.abs(cy - h.y) < 7 && Math.abs(cx - h.x) < 14
        : h.type === 'nail' ? Math.abs(cx - h.x) < 7 && cy > h.y - 44 && cy < h.y + 5
        : Math.hypot(cx - h.x, cy - h.y) < 13;
      if (hit) { cut(h.why); return; }
    }
  }
  S.hz = S.hz.filter(h => h.t < 9 && !(h.live && (h.x < -80 || h.x > W + 80 || h.y > S.camY + H + 120)));
}

// ---------- update ----------
function update(dt) {
  const p = S.p;
  if (S.mode === 'pause' || S.mode === 'menu') return;
  S.modeT += dt;
  for (const pl of plats) if (pl.gone && pl.goneT < 1) pl.goneT += dt * 1.4;
  S.parts = S.parts.filter(q => (q.t += dt) < q.life);
  for (const q of S.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 500 * dt; }
  if (S.mode === 'cut') { S.cutT += dt; if (S.cutT > 1.45) respawn(); return; }
  if (S.mode === 'intro') { if (S.modeT > 2.8) play(); return; }
  if (S.mode === 'ending') { endingCues(); return; }
  S.clock += dt;

  // moving and blinking lines
  for (const pl of plats) {
    if (pl.sway) { const nx = pl.bx + pl.sway * Math.sin(S.clock * 1.2 + pl.phase); pl.dx = nx - pl.x; pl.x = nx; }
    if (pl.blink) pl.off = (S.clock + pl.phase) % pl.blink > pl.blink * .7;
  }

  if (S.mode === 'play') {
    S.time += dt;
    // credits roll faster the closer you get to the end, and stop once THE END is in the frame
    const k = clamp(S.camY / (endTop || 1), 0, 1);
    S.camY = Math.min(S.camY + (34 + 40 * k) * (LV.speed || 1) * dt, endTop - H * .6);
  }

  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const target = S.mode === 'play' ? dir * SPEED : 0;
  p.vx += clamp(target - p.vx, -ACC * dt, ACC * dt);
  p.coyote = p.ground ? .09 : Math.max(0, p.coyote - dt);
  p.buffer = Math.max(0, p.buffer - dt);
  if (p.buffer > 0 && p.coyote > 0 && S.mode === 'play') {
    p.vy = -JUMP * (LV.jump || 1); p.buffer = 0; p.coyote = 0; p.ground = null;
  }
  p.vy = Math.min(MAXFALL * (LV.fall || 1), p.vy + GRAV * (LV.grav || 1) * dt);

  // a swaying line carries whoever stands on it
  if (p.ground && p.ground.sway) p.x += p.ground.dx;
  const prevGround = p.ground, impact = p.vy;
  const prevBottom = p.y + PH;
  p.x = clamp(p.x + p.vx * dt, 0, W - PW);
  p.y += p.vy * dt;

  // one-way platforms: land on a word only while falling onto its top
  p.ground = null;
  if (p.vy >= 0) {
    let best = null;
    for (const pl of plats) {
      if (pl.gone || pl.off || p.x + PW <= pl.x || p.x >= pl.x + pl.w) continue;
      if (prevBottom <= pl.top + .5 && p.y + PH >= pl.top && (!best || pl.top < best.top)) best = pl;
    }
    if (best) {
      p.y = best.top - PH; p.vy = 0; p.ground = best;
      if (!prevGround) {
        const k = clamp(impact / MAXFALL, 0, 1);
        p.squash = .3 + .7 * k;
        landNote(best, k);
        if (k > .45) burst(p.x + PW / 2, p.y + PH, 4, LV.pal.dim, 60);
      }
    }
  }
  p.squash = Math.max(0, p.squash - dt * 6);

  if (p.ground && p.ground.fragile) {
    p.ground.hold += dt;
    if (p.ground.hold > .55) { p.ground.gone = true; p.ground = null; noise(.18, .18, 1800); }
  }
  if (p.ground && p.ground.end && S.mode === 'play') { finishLevel(); return; }

  for (let i = S.cp + 1; i < checkpoints.length; i++) if (p.y > checkpoints[i].top) {
    S.cp = i;
    for (const s of stars) if (s.got) s.banked = true;
    tone(523.3, 1.2, .1);
    hud();
  }

  if (S.mode === 'play') {
    const cx = p.x + PW / 2, cy = p.y + PH / 2;
    for (const s of stars) if (!s.got && Math.hypot(s.x - cx, s.y - cy) < 15) {
      s.got = true;
      burst(s.x, s.y, 10, LV.pal.star, 140);
      tone(1318.5, .5, .06); tone(1975.5, .7, .05, .08);
      hud();
    }
  }

  p.trail.unshift({ x: p.x + PW / 2, y: p.y + PH / 2 });
  if (p.trail.length > 10) p.trail.pop();

  updateHazards(dt);
  if (S.mode !== 'play') return;

  while (S.recT <= S.time) { S.rec.push(Math.round(p.x), Math.round(p.y)); S.recT += 1 / REC_HZ; }
  // the camera chases a falling dot, but slower than it falls: a short slip is forgiven, a long drop is not
  const low = p.y - S.camY - H * .68;
  if (low > 0) S.camY = Math.min(S.camY + Math.min(low, 140 * dt), endTop - H * .6);
  const sy = p.y - S.camY;
  if (sy + PH < -2) cut('Тебя унесло за верх кадра');
  else if (sy > H + 2) cut('Ты выпал из кадра');
}

// ---------- drawing: decorations ----------
function drawTie(x, y, s, t, ph) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * .0012 + ph) * .07); ctx.scale(s, s);
  ctx.fillStyle = LV.pal.accent;
  ctx.beginPath(); ctx.moveTo(-8, -40); ctx.lineTo(8, -40); ctx.lineTo(5, -28); ctx.lineTo(-5, -28); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-5, -28); ctx.lineTo(5, -28); ctx.lineTo(11, 30); ctx.lineTo(0, 44); ctx.lineTo(-11, 30); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2;
  for (let k = -20; k < 40; k += 12) { ctx.beginPath(); ctx.moveTo(-10, k); ctx.lineTo(10, k - 8); ctx.stroke(); }
  ctx.restore();
}
function drawHead(x, y, s, side) {
  ctx.save(); ctx.translate(x, y); ctx.scale(side ? -s : s, s);
  ctx.fillStyle = '#161616'; ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, 0, 20, 25, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillRect(-8, 20, 16, 16);
  // the barcode on the back of the head
  ctx.fillStyle = LV.pal.film;
  const bars = [2, 1, 1, 3, 1, 2, 1, 1, 2, 1];
  let bx = -18;
  bars.forEach((w, i) => { if (i % 2 === 0) ctx.fillRect(bx, -4, w, 11); bx += w + 1; });
  ctx.restore();
}
function drawMask(x, y, s, glowA) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(180,215,255,.6)'; ctx.shadowBlur = 12 * glowA;
  ctx.fillStyle = '#f2efe8';
  // horns
  ctx.beginPath(); ctx.moveTo(-12, -10); ctx.quadraticCurveTo(-26, -30, -16, -50); ctx.quadraticCurveTo(-14, -30, -4, -16); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(12, -10); ctx.quadraticCurveTo(26, -30, 16, -50); ctx.quadraticCurveTo(14, -30, 4, -16); ctx.closePath(); ctx.fill();
  // face
  ctx.beginPath(); ctx.moveTo(-17, -6); ctx.quadraticCurveTo(-19, 18, 0, 26); ctx.quadraticCurveTo(19, 18, 17, -6); ctx.quadraticCurveTo(0, -20, -17, -6); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#05070c';
  ctx.beginPath(); ctx.ellipse(-7, 4, 5, 8, -.15, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7, 4, 5, 8, .15, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawNail(x, y, s, angle, color = '#c9d2de') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.scale(s, s);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(-2.5, -40); ctx.lineTo(2.5, -40); ctx.lineTo(2.5, 2); ctx.lineTo(0, 10); ctx.lineTo(-2.5, 2); ctx.closePath(); ctx.fill();
  ctx.fillRect(-8, -42, 16, 3);
  ctx.fillStyle = '#4a3a30'; ctx.fillRect(-2, -56, 4, 14);
  ctx.restore();
}
function drawButterfly(x, y, t, ph) {
  const flap = Math.abs(Math.sin(t * .012 + ph));
  ctx.save(); ctx.translate(x, y);
  ctx.shadowColor = 'rgba(90,180,255,.9)'; ctx.shadowBlur = 12;
  ctx.fillStyle = 'rgba(110,190,255,.9)';
  for (const sd of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(sd * 5 * flap, -3, 6 * flap + .5, 7, sd * .5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(sd * 4 * flap, 5, 4 * flap + .5, 4.5, -sd * .4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.shadowBlur = 0; ctx.fillStyle = '#dff0ff'; ctx.fillRect(-.7, -5, 1.4, 11);
  ctx.restore();
}
function drawPlanet(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const g = ctx.createRadialGradient(-8, -8, 2, 0, 0, 26);
  g.addColorStop(0, '#f6b26b'); g.addColorStop(1, '#5a2a12');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(243,211,107,.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 0, 40, 9, -.35, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}
function drawSatellite(x, y, s, t, ph) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * .0006 + ph) * .5); ctx.scale(s, s);
  ctx.fillStyle = '#7d8aa8'; ctx.fillRect(-14 - 16, -5, 16, 10); ctx.fillRect(14, -5, 16, 10);
  ctx.fillStyle = '#c9ced6'; ctx.fillRect(-8, -7, 16, 14);
  ctx.fillStyle = LV.pal.accent; ctx.fillRect(-1, -12, 2, 5);
  ctx.restore();
}
function drawRocket(x, y, s, t) {

const grain = document.createElement('canvas');
grain.width = grain.height = 160;
{

function render(t) {

  ctx.globalAlpha = 1;
  const P = LV.pal;
  ctx.fillStyle = P.bg;
  ctx.fillRect(0, 0, W, H);
  if (S.mode === 'menu') { drawMenu(t); finish(t); return; }

  const still = S.mode === 'pause';
  const flick = REDUCED || still ? 1 : .94 + .06 * Math.random();

  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  drawBackdrop(t, cam, 1 - fade);

  ctx.save();
  ctx.translate(0, -cam);
  ctx.globalAlpha = 1 - fade;
  drawProps(t, cam);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (const d of deco) {
    if (d.base - cam < -40 || d.base - cam > H + 100) continue;
    ctx.globalAlpha = .8 * flick * (1 - fade); ctx.font = d.font; ctx.fillStyle = d.color; ctx.fillText(d.text, d.x, d.base);
  }

// ---------- the five endings ----------
const ENDING_LEN = { truck: 11.5, late: 9.6, blind: 9.4, almost: 9.8, full: 13.2 };

function cue(id, at, fn) { if (S.modeT >= at && !S.cues.has(id)) { S.cues.add(id); fn(); } }
function endingCues() {
  const e = S.ending;
  if (e === 'truck') { cue('horn', 2.2, horn); cue('crash', 3.2, () => { noise(1.2, .8, 1400, 'lowpass'); noise(.3, .5, 3000); }); }
  if (e === 'late') for (let i = 1; i < 9; i++) cue('tick' + i, i, () => noise(.03, .25, 4000));
  if (e === 'blind') cue('whoosh', .1, () => noise(1.8, .25, 700, 'bandpass'));
  if (e === 'almost') cue('lights', 1, () => tone(392, 2.5, .08));
  if (e === 'full') {
    [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => cue('arp' + i, .3 + i * .28, () => tone(261.6 * Math.pow(2, s / 12), 1.4, .08)));

    cue('begin', 8.6, () => [0, 4, 7, 11, 14].forEach((s, i) => tone(392 * Math.pow(2, s / 12), 3, .06, i * .09)));
  }
  cue('message', ENDING_LEN[e] - 2.6, () => tone(523.3, 2.2, .1));
}

function lines(T, rows, color) {
  for (const [t0, text, font, y, col] of rows) {

}

  if (T > at) caption(`ВРЕМЯ ${fmt(s.time)} · В ГРАФИКЕ ${s.inTime}/${LEVELS.length} · ★ ${s.got}/${s.total}`, `500 12px ${MONO}`, y, color, clamp((T - at) / .8, 0, 1));

const MOTTO = 'ТОРОПИСЬ ЖИТЬ. ЖИЗНЬ ОДНА.';

function drawEnding(t) {
  const T = S.modeT, e = S.ending, big = `italic 600 34px ${SERIF}`, mid = `italic 500 21px ${SERIF}`, motto = `600 22px ${MONO}`;
  const y0 = H * .28;
  if (e === 'truck') {
    // the anime white-out: the frame bleaches, speed lines, a truck out of nowhere
    const white = clamp(T / 2.2, 0, 1);
    ctx.fillStyle = `rgba(255,255,255,${.9 * white})`; ctx.fillRect(0, 0, W, H);
    if (T < 3.2 && !REDUCED) {
      ctx.strokeStyle = `rgba(0,0,0,${.25 * white})`; ctx.lineWidth = 1;
      for (let i = 0; i < 48; i++) {
        const a = i / 48 * Math.PI * 2 + Math.sin(i * 7.1) * .05, r0 = 120 + (i * 37 % 90) + (t * .4 % 60);
        ctx.beginPath(); ctx.moveTo(CX + Math.cos(a) * r0, H * .55 + Math.sin(a) * r0); ctx.lineTo(CX + Math.cos(a) * 700, H * .55 + Math.sin(a) * 700); ctx.stroke();
      }
    }
    if (T > 2.2 && T < 3.2) {
      const k = (T - 2.2) / 1, s = .08 + 3.2 * k * k;
      ctx.save(); ctx.translate(CX + (Math.random() - .5) * 6 * k, H * .58); ctx.scale(s, s);
      ctx.fillStyle = '#141414';
      ctx.fillRect(-90, -120, 180, 150);            // cab
      ctx.fillRect(-110, 30, 220, 26);               // bumper
      ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-70, -100, 140, 50); // windscreen
      ctx.fillStyle = '#0a0a0a'; for (let i = -60; i <= 60; i += 15) ctx.fillRect(i - 2, -30, 4, 50);
      ctx.fillStyle = '#fffbe6'; ctx.shadowColor = '#fff3b0'; ctx.shadowBlur = 30;
      ctx.beginPath(); ctx.arc(-70, 0, 16, 0, Math.PI * 2); ctx.arc(70, 0, 16, 0, Math.PI * 2); ctx.fill();
      ctx.restore(); ctx.shadowBlur = 0;
    }
    if (T >= 3.2) {
      const f = clamp(1 - (T - 3.2) / .5, 0, 1);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      if (f > 0) { ctx.fillStyle = `rgba(255,250,220,${f})`; ctx.fillRect(0, 0, W, H); }
      lines(T, [
        [3.8, 'Тебя сбил грузовик.', big, y0],
        [5.0, 'Ты слишком долго смотрел чужие титры', mid, y0 + 48],
        [5.6, 'и почти ничего не успел собрать.', mid, y0 + 76],
        [7.0, 'Перерождения в другом мире не будет.', mid, y0 + 124],
        [8.6, MOTTO, motto, y0 + 196, CUT],
      ], '#141414');
      endingStats(T, 9.6, '#6b6b6b');
    }
  } else if (e === 'late') {
    // the hall empties around you
    ctx.fillStyle = `rgba(0,0,0,${clamp(T / 1.5, 0, .85)})`; ctx.fillRect(0, 0, W, H);
    const rise = ease(clamp(T / 2.5, 0, 1));
    ctx.fillStyle = '#16110f';
    for (let r = 0; r < 3; r++) for (let i = 0; i < 9; i++) {
      const x = 20 + i * 58 + (r % 2) * 29, y = H - 40 - r * 46 + (1 - rise) * 160;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, 44, 60, 10) : ctx.rect(x, y, 44, 60); ctx.fill();
    }
    lines(T, [
      [1.6, 'Ты собрал почти всё, что видел.', big, y0],
      [3.0, 'Но смотрел слишком долго.', mid, y0 + 48],
      [4.2, 'Зал опустел. Сеанс давно закончился.', mid, y0 + 76],
      [6.4, MOTTO, motto, y0 + 150, CUT],
    ], '#efe8dc');
    endingStats(T, 7.4, '#8e877c', y0 + 210);
  } else if (e === 'blind') {
    // everything rushes past
    ctx.fillStyle = `rgba(0,0,0,${clamp(T / 1.2, 0, .85)})`; ctx.fillRect(0, 0, W, H);
    if (!REDUCED) for (let i = 0; i < 40; i++) {
      const y = (i * 53.7) % H, x = ((t * (1.2 + (i % 5) * .4) + i * 97) % (W + 300)) - 150;
      ctx.fillStyle = `rgba(239,232,220,${.08 + (i % 3) * .05})`; ctx.fillRect(x, y, 140, 1.5);
    }
    lines(T, [
      [1.4, 'Ты успел на каждый сеанс.', big, y0],
      [2.8, 'Но пробежал мимо почти всех звёзд.', mid, y0 + 48],
      [4.2, 'Спешить жить — не значит не смотреть.', mid, y0 + 76],
      [6.2, MOTTO, motto, y0 + 150, CUT],
    ], '#efe8dc');
    endingStats(T, 7.2, '#8e877c');
  } else if (e === 'almost') {
    // house lights up, warm and plain
    const L = clamp((T - .8) / 2, 0, 1);
    ctx.fillStyle = `rgba(242,234,220,${L})`; ctx.fillRect(0, 0, W, H);
    const s = S.summary, miss = s.total - s.got;
    lines(T, [
      [2.0, 'Свет в зале включили.', big, y0],
      [3.2, 'Ты успел. Почти все звёзды — с тобой.', mid, y0 + 48],
      [4.4, `${miss} ${plural(miss, 'осталась', 'остались', 'остались')} в темноте.`, mid, y0 + 76],
      [5.4, 'Вернуться за ними нельзя: жизнь одна.', mid, y0 + 104],
      [6.6, 'ТОРОПИСЬ ЖИТЬ.', motto, y0 + 170, '#b5291f'],
    ], '#1a1416');
    endingStats(T, 7.6, '#7a7166');
  } else if (e === 'full') {
    drawFull(t, T);
  }
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? few : many;
}

// every star of the evening flies home, the dot becomes the sun, and the end turns into a beginning
function drawFull(t, T) {
  const p = S.p, dot = { x: p.x + PW / 2, y: p.y + PH / 2 - S.camY };
  const n = S.summary.total;
  if (T < 2.6) {
    ctx.fillStyle = `rgba(0,0,0,${clamp(T / 1, 0, .7)})`; ctx.fillRect(0, 0, W, H);
    ctx.font = `500 16px ${SERIF}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < n; i++) {
      const k = ease(clamp((T - i * (1.6 / n)) / .9, 0, 1));
      if (k >= 1) continue;
      const a = i * 2.399, R = 420 * (1 - k);
      ctx.globalAlpha = .9; ctx.fillStyle = '#fff6df'; ctx.shadowColor = '#fff1c8'; ctx.shadowBlur = 10;
      ctx.fillText('★', dot.x + Math.cos(a + k * 2) * R, dot.y + Math.sin(a + k * 2) * R);
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
    const glow = 6 + 30 * clamp(T / 2.4, 0, 1);
    ctx.shadowColor = '#fff1c8'; ctx.shadowBlur = glow * 2; ctx.fillStyle = '#fffaf0';
    ctx.beginPath(); ctx.arc(dot.x, dot.y, 5 + glow * .25, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    return;
  }
  // dawn
  const k = ease(clamp((T - 2.6) / 4, 0, 1));
  const mix = (a, b) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const top = mix([6, 7, 20], [70, 120, 190]), bot = mix([20, 12, 30], [255, 183, 110]);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, `rgb(${top})`); sky.addColorStop(1, `rgb(${bot})`);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  const flash = clamp(1 - (T - 2.6) / .6, 0, 1);
  const sunY = H * .78 - (H * .3) * k, sunR = 12 + 46 * k;
  const sg = ctx.createRadialGradient(CX, sunY, 0, CX, sunY, sunR * 3);
  sg.addColorStop(0, 'rgba(255,250,235,1)'); sg.addColorStop(.33, 'rgba(255,236,190,.9)'); sg.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(CX, sunY, sunR * 3, 0, Math.PI * 2); ctx.fill();
  // the city wakes up
  for (const b of skyline) {
    const bh = b.h * (.6 + .4 * k);
    ctx.fillStyle = '#120c14'; ctx.fillRect(b.x, H - bh, b.w, bh);
    ctx.fillStyle = `rgba(255,214,140,${.8 * (1 - k * .6)})`;
    b.lit.forEach((on, i) => { if (on && (i % 3) * 14 + 8 < bh - 8) ctx.fillRect(b.x + 4 + (i % 2) * 8, H - bh + 8 + Math.floor(i / 2) * 14, 4, 6); });
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
  const ink = '#1a1416';
  lines(T, [
    [4.0, 'Ты успел всё.', `italic 600 34px ${SERIF}`, H * .18],
    [5.0, `Все ${n} ${plural(n, 'звезда', 'звезды', 'звёзд')} — с тобой.`, `italic 500 21px ${SERIF}`, H * .18 + 40],
  ], ink);
  // GOING TO THE END → GOING TO THE BEGINNING
  if (T > 6.6) {
    const a = clamp((T - 6.6) / .8, 0, 1), font = `600 34px ${SERIF}`, y = H * .38;
    ctx.font = font;
    const head = 'GOING TO THE ', hw = ctx.measureText(head).width;
    const typed = 'BEGINNING'.slice(0, Math.floor(clamp((T - 8.6) / 1.2, 0, 1) * 9));
    const tail = T < 8.6 ? 'END' : typed;
    const total = hw + ctx.measureText(tail || 'END').width, x0 = CX - total / 2;
    ctx.globalAlpha = a; ctx.fillStyle = ink; ctx.textAlign = 'left';
    ctx.fillText(head, x0, y);
    if (T < 8.6) {
      ctx.fillText('END', x0 + hw, y);
      const s = clamp((T - 7.8) / .5, 0, 1), ew = ctx.measureText('END').width;
      if (s > 0) { ctx.fillStyle = CUT; ctx.fillRect(x0 + hw - 2, y - 12, (ew + 4) * s, 3); }
    } else {
      ctx.fillStyle = '#b5291f'; ctx.fillText(tail, x0 + hw, y);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'center';
  }
  lines(T, [[10.4, MOTTO, `600 22px ${MONO}`, H * .38 + 56, '#b5291f']], ink);
  endingStats(T, 11.2, '#3a2a24');
}

// ---------- hud ----------
function hud() {
  $('lvl').textContent = `${S.li + 1} / ${LEVELS.length} · ${checkpoints[S.cp] ? checkpoints[S.cp].name : ''}`;
  $('take').textContent = S.take;
  $('stars').textContent = `${stars.filter(s => s.got).length} / ${stars.length}`;
  $('fresh').hidden = !(S.mode === 'menu' && RUN.li > 0);
  $('pause').setAttribute('aria-pressed', String(S.mode === 'pause'));
  timer();
}
function timer() {
  const el = $('time');
  el.textContent = `${fmt(S.time)} / ${fmt(S.par)}`;
  el.classList.toggle('late', S.time > S.par);
}

// ---------- loop ----------
let last = performance.now(), lastSec = -1;
function frame(t) {
  const dt = Math.min(1 / 30, Math.max(0, (t - last) / 1000)); last = t;
  update(dt);
  render(t);
  const sec = Math.floor(S.time);
  if (sec !== lastSec) { lastSec = sec; timer(); }
  requestAnimationFrame(frame);
}

// ---------- input ----------
function togglePause(force) {
  if (S.mode === 'pause' && force !== true) { S.mode = S.pauseFrom; S.pauseFrom = null; }
  else if (S.mode === 'play' || S.mode === 'cut') { S.pauseFrom = S.mode; S.mode = 'pause'; keys.left = keys.right = keys.jump = false; }
  hud();
}
function newRun() {
  RUN = freshRun(); saveRun();
  startLevel(0, 'menu');
}
function press(k) {
  audioInit();
  if (S.mode === 'pause') { togglePause(); return; }
  if (S.mode === 'menu') { startLevel(RUN.li); return; }
  if (S.mode === 'intro') { if (S.modeT > .6) play(); return; }
  if (S.mode === 'clear') { if (S.modeT > 2.2) startLevel(RUN.li); return; }
  if (S.mode === 'ending') { if (S.modeT > ENDING_LEN[S.ending]) startLevel(0, 'menu'); return; }
  if (k === 'jump') S.p.buffer = .12;
}
const MAP = {
  ArrowLeft: 'left', a: 'left', 'ф': 'left',
  ArrowRight: 'right', d: 'right', 'в': 'right',
  ' ': 'jump', ArrowUp: 'jump', w: 'jump', 'ц': 'jump', Enter: 'jump',
};
const keyOf = e => MAP[e.key.length === 1 ? e.key.toLowerCase() : e.key];
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const ch = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (ch === 'm' || ch === 'ь') { setMute(!AU.muted); return; }
  if (ch === 'p' || ch === 'з' || ch === 'Escape') { e.preventDefault(); togglePause(); return; }
  if ((ch === 'n' || ch === 'т') && S.mode === 'menu') { newRun(); return; }
  const k = keyOf(e);
  if (!k) return;
  e.preventDefault();
  if (e.repeat) return;
  keys[k] = true;
  press(k);
});
addEventListener('keyup', e => {
  const k = keyOf(e);
  if (!k) return;
  keys[k] = false;
  // a short tap gives a short hop
  if (k === 'jump' && S.p.vy < 0) S.p.vy *= .5;
});
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; if (S.mode === 'play') togglePause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S.mode === 'play') togglePause(true); });
cv.addEventListener('pointerdown', () => { if (S.mode !== 'play' && S.mode !== 'cut') press('jump'); });
for (const b of $('pads').querySelectorAll('button')) {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); keys[k] = true; b.classList.add('on'); press(k); };
  const up = () => { keys[k] = false; b.classList.remove('on'); if (k === 'jump' && S.p.vy < 0) S.p.vy *= .5; };
  b.addEventListener('pointerdown', down);
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, up);
}
$('snd').addEventListener('click', () => setMute(!AU.muted));
$('pause').addEventListener('click', () => togglePause());
$('fresh').addEventListener('click', newRun);

// ---------- boot: re-measure the words once the typefaces arrive ----------
const fontsReady = Promise.race([
  Promise.all(LEVELS.flatMap(L => Object.values(L.fonts).map(f => document.fonts.load(f[0])))),
  new Promise(r => setTimeout(r, 2000)),
]).catch(() => {});
$('snd').setAttribute('aria-pressed', String(!AU.muted));
startLevel(RUN.li, 'menu');
requestAnimationFrame(frame);
fontsReady.then(() => { if (S.mode === 'menu') startLevel(RUN.li, 'menu'); });
})();
</script>
</body>
</html>
