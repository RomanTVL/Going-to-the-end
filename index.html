<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Going to the End</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: тёмный зал, один экран по центру, под ним табличка с номером дубля */
:root {
  --hall: #050405;
  --screen: #000;
  --film: #efe8dc;
  --dim: #8e877c;
  --seat: #1c1719;
  --cut: #ff4a3d;
  --f-film: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-slate: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(70% 50% at 50% 30%, #151012 0%, var(--hall) 70%) fixed, var(--hall);
  color: var(--film);
  font-family: var(--f-slate);
  font-size: 13px;
}
.hall {
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen {
  width: min(100%, calc((100dvh - 190px) * 0.8), 560px);
  min-width: min(260px, 100%);
  aspect-ratio: 4 / 5;
  background: var(--screen);
  box-shadow: 0 0 0 1px #201a1c, 0 0 80px rgba(239, 232, 220, .07), 0 40px 120px -40px rgba(239, 232, 220, .18);
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.slate {
  width: min(100%, 560px);
  margin: 0;
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px;
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.slate b { color: var(--film); font-weight: 500; }
.hint { color: #6a625b; letter-spacing: .08em; justify-content: center; text-align: center; }
.pads { display: none; gap: 10px; width: min(100%, 560px); }
.pads button {
  flex: 1; height: 58px; font: 500 20px var(--f-slate); color: var(--film);
  background: var(--seat); border: 1px solid #2c2427; border-radius: 0;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
.pads button.on { background: #2c2427; border-color: var(--film); }
.pads .jump { flex: 1.4; }
button:focus-visible { outline: 2px solid var(--film); outline-offset: 2px; }
@media (pointer: coarse) { .pads { display: flex; } .hint { display: none; } }
</style>
</head>
<body>
<main class="hall">
  <div class="screen"><canvas id="cv" aria-label="Экран с титрами"></canvas></div>
  <div class="slate">
    <span>Дубль <b id="take">1</b></span>
    <span>Сцена <b id="scene">—</b></span>
    <span>Время <b id="time">00:00</b></span>
    <span>Рекорд <b id="best">—</b></span>
  </div>
  <div class="pads" id="pads">
    <button data-k="left" aria-label="Влево">◀</button>
    <button data-k="jump" class="jump" aria-label="Прыжок">▲</button>
    <button data-k="right" aria-label="Вправо">▶</button>
  </div>
  <p class="slate hint">← → или A D — идти · Пробел или ↑ — прыжок · не вылетай из кадра</p>
</main>

<script>
(() => {
'use strict';

const W = 540, H = 675, CX = W / 2;
const LINE = 74;                       // distance between credit lines
const PW = 10, PH = 10;                // the dot
const GRAV = 1500, JUMP = 520, RUN = 230, ACC = 2200, MAXFALL = 780;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FILM = '#efe8dc', DIM = '#8e877c';
const SERIF = '"Cormorant Garamond", Georgia, "Times New Roman", serif';
const MONO = '"IBM Plex Mono", ui-monospace, monospace';

// '~' marks a name that crumbles a moment after you stand on it
const CREDITS = [
  ['title', 'GOING TO THE END'],
  ['c', 'Фильм окончен. Не вставай.'],
  ['h', 'В ролях'],
  ['r', 'Точка', 'Ты'],
  ['r', 'Гравитация', 'Сама себя'],
  ['r', 'Верхний край кадра', 'Время'],
  ['r', 'Нижний край кадра', 'Пустота'],
  ['c', 'а также'],
  ['w', 'Тень', 'Свет', 'Пыль', 'Плёнка'],
  ['r', 'Зритель в третьем ряду', '~Неизвестен'],
  ['c', 'Все персонажи вымышлены, кроме тебя'],
  ['h', 'Постановка'],
  ['r', 'Режиссёр', 'Случай'],
  ['r', 'Сценарий', 'Никто не дочитал'],
  ['r', 'Оператор', 'Камера, что не ждёт'],
  ['r', 'Монтаж', '~Вырезано'],
  ['w', 'Аня', 'Боря', 'Вера', '~Гоша'],
  ['r', 'Свет', 'Проектор № 2'],
  ['r', 'Помощник режиссёра', 'Кофе'],
  ['c', 'Снято одним дублем. Почти.'],
  ['h', 'Музыка'],
  ['r', 'Композитор', 'Тишина'],
  ['r', 'Звукорежиссёр', 'Шорох попкорна'],
  ['w', 'До', 'Ре', '~Ми', 'Фа', 'Соль', '~Ля', 'Си'],
  ['r', 'Песня «До конца»', 'Все, кто остался'],
  ['c', 'Музыка не прозвучала ни разу'],
  ['h', 'Каскадёры'],
  ['r', 'Падения', 'Ты'],
  ['r', 'Ещё падения', 'Тоже ты'],
  ['r', 'Дублёр', '~Отсутствовал'],
  ['w', '~Раз', 'Два', '~Три'],
  ['c', '~Ни одна точка не пострадала'],
  ['r', 'Страховка', '~Не предусмотрена'],
  ['h', 'Благодарности'],
  ['r', 'Тем, кто не ушёл', 'Спасибо'],
  ['r', 'Тем, кто ушёл', '~Тоже спасибо'],
  ['r', 'Билетёру', 'За терпение'],
  ['w', 'Маме', '~Папе', 'Коту'],
  ['c', 'Свет в зале включат через минуту'],
  ['r', 'Уборка зала', '~Уже идёт'],
  ['c', 'Сцены после титров не будет'],
  ['end', 'THE END'],
];

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } },
};
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

const cv = $('cv'), ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;

// ---------- layout: every word on screen is a platform ----------
let plats = [], deco = [], checkpoints = [], endTop = 0;

function platform(text, font, size, x, base, color, extra = {}) {
  ctx.font = font;
  const fragile = text.startsWith('~');
  if (fragile) text = text.slice(1);
  const w = ctx.measureText(text).width;
  const p = { text, font, size, x, w, base, top: base - size * .66, color, fragile, hold: 0, gone: false, goneT: 0, ...extra };
  plats.push(p);
  return p;
}
function measure(text, font) { ctx.font = font; return ctx.measureText(text.replace('~', '')).width; }

function layout() {
  plats = []; deco = []; checkpoints = [];
  let y = H * .42;
  for (const [type, ...a] of CREDITS) {
    if (type === 'title') {
      // the title is four separate words, the gaps between them are the first way down
      const font = `600 40px ${SERIF}`, sep = 20;
      const words = a[0].split(' '), ws = words.map(t => measure(t, font));
      const x0 = CX - (ws.reduce((s, v) => s + v, 0) + sep * (words.length - 1)) / 2;
      let x = x0, top = 0;
      words.forEach((t, i) => { top = platform(t, font, 40, x, y, FILM, { glow: true }).top; x += ws[i] + sep; });
      checkpoints.push({ name: 'Начало', top, x: x0 + ws[0] / 2 });
      y += LINE * 1.6;
    } else if (type === 'h') {
      y += LINE * .45;
      const text = a[0].toUpperCase(), font = `italic 600 30px ${SERIF}`;
      const p = platform(text, font, 30, CX - measure(text, font) / 2, y, FILM);
      checkpoints.push({ name: a[0], top: p.top, x: CX });
      y += LINE * 1.15;
    } else if (type === 'r') {
      const rf = `600 14px ${SERIF}`, nf = `500 24px ${SERIF}`, role = a[0].toUpperCase();
      platform(role, rf, 14, CX - 18 - measure(role, rf), y, DIM);
      platform(a[1], nf, 24, CX + 18, y, FILM);
      y += LINE;
    } else if (type === 'c') {
      // a sentence: every word stands apart, so there is always a gap to drop through
      const font = `italic 500 22px ${SERIF}`, sep = 16, fragile = a[0].startsWith('~');
      const words = a[0].replace('~', '').split(' '), ws = words.map(t => measure(t, font));
      let x = CX - (ws.reduce((s, v) => s + v, 0) + sep * (words.length - 1)) / 2;
      words.forEach((t, i) => { platform((fragile ? '~' : '') + t, font, 22, x, y, FILM); x += ws[i] + sep; });
      y += LINE;
    } else if (type === 'w') {
      const font = `500 22px ${SERIF}`, sep = 34;
      const ws = a.map(t => measure(t, font));
      let x = CX - (ws.reduce((s, v) => s + v, 0) + sep * (a.length - 1)) / 2;
      a.forEach((t, i) => {
        platform(t, font, 22, x, y, FILM);
        x += ws[i];
        if (i < a.length - 1) deco.push({ text: '·', font, x: x + sep / 2 - 3, base: y, color: DIM });
        x += sep;
      });
      y += LINE;
    } else if (type === 'end') {
      y += LINE * 1.2;
      const font = `600 84px ${SERIF}`, sep = 34;
      const words = a[0].split(' '), ws = words.map(t => measure(t, font));
      let x = CX - (ws[0] + ws[1] + sep) / 2;
      words.forEach((t, i) => { platform(t, font, 84, x, y, FILM, { end: true, glow: true }); x += ws[i] + sep; });
      endTop = y - 84 * .66;
    }
  }
}

// ---------- state ----------
let S;
const keys = { left: false, right: false, jump: false };

function reset() {
  layout();
  const cp = checkpoints[0];
  S = {
    mode: 'title', camY: 0, time: 0, take: 1, cp: 0, cutT: 0, cutWhy: '', wonT: 0,
    p: { x: cp.x - PW / 2, y: cp.top - PH, vx: 0, vy: 0, ground: null, coyote: 0, buffer: 0, trail: [] },
  };
  hud();
}

function begin() { if (S.mode === 'title') { S.mode = 'play'; hud(); } }

function respawn() {
  const cp = checkpoints[S.cp];
  for (const pl of plats) if (pl.top >= cp.top - 1) { pl.gone = false; pl.hold = 0; pl.goneT = 0; }
  S.camY = Math.max(0, cp.top - H * .4);
  Object.assign(S.p, { x: cp.x - PW / 2, y: cp.top - PH, vx: 0, vy: 0, ground: null, coyote: 0, buffer: 0, trail: [] });
  S.mode = 'play';
}

function cut(why) {
  S.mode = 'cut'; S.cutT = 0; S.cutWhy = why; S.take++;
  hud();
}

function win() {
  S.mode = 'won'; S.wonT = 0;
  const best = +(store.get('gtte-credits-best') || 0);
  if (!best || S.time < best) store.set('gtte-credits-best', S.time.toFixed(2));
  hud();
}

// ---------- update ----------
function update(dt) {
  const p = S.p;
  for (const pl of plats) if (pl.gone && pl.goneT < 1) pl.goneT += dt * 1.4;
  if (S.mode === 'cut') { S.cutT += dt; if (S.cutT > 1.25) respawn(); return; }
  if (S.mode === 'title') return;
  if (S.mode === 'won') S.wonT += dt;

  if (S.mode === 'play') {
    S.time += dt;
    // credits roll faster the closer you get to the end, and stop once THE END is in the frame
    const k = clamp(S.camY / (endTop || 1), 0, 1);
    S.camY = Math.min(S.camY + (34 + 40 * k) * dt, endTop - H * .6);
  }

  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const target = S.mode === 'won' ? 0 : dir * RUN;
  p.vx += clamp(target - p.vx, -ACC * dt, ACC * dt);
  p.coyote = p.ground ? .09 : Math.max(0, p.coyote - dt);
  p.buffer = Math.max(0, p.buffer - dt);
  if (p.buffer > 0 && p.coyote > 0 && S.mode === 'play') {
    p.vy = -JUMP; p.buffer = 0; p.coyote = 0; p.ground = null;
  }
  p.vy = Math.min(MAXFALL, p.vy + GRAV * dt);

  const prevBottom = p.y + PH;
  p.x = clamp(p.x + p.vx * dt, 0, W - PW);
  p.y += p.vy * dt;

  // one-way platforms: land on a word only while falling onto its top
  p.ground = null;
  if (p.vy >= 0) {
    let best = null;
    for (const pl of plats) {
      if (pl.gone || p.x + PW <= pl.x || p.x >= pl.x + pl.w) continue;
      if (prevBottom <= pl.top + .5 && p.y + PH >= pl.top && (!best || pl.top < best.top)) best = pl;
    }
    if (best) { p.y = best.top - PH; p.vy = 0; p.ground = best; }
  }

  if (p.ground && p.ground.fragile) {
    p.ground.hold += dt;
    if (p.ground.hold > .55) { p.ground.gone = true; p.ground = null; }
  }
  if (p.ground && p.ground.end && S.mode === 'play') win();

  for (let i = S.cp + 1; i < checkpoints.length; i++) if (p.y > checkpoints[i].top) { S.cp = i; hud(); }

  p.trail.unshift({ x: p.x + PW / 2, y: p.y + PH / 2 });
  if (p.trail.length > 10) p.trail.pop();

  if (S.mode === 'play') {
    // the camera chases a falling dot, but slower than it falls: a short slip is forgiven, a long drop is not
    const low = p.y - S.camY - H * .68;
    if (low > 0) S.camY = Math.min(S.camY + Math.min(low, 140 * dt), endTop - H * .6);
    const sy = p.y - S.camY;
    if (sy + PH < -2) cut('Тебя унесло за верх кадра');
    else if (sy > H + 2) cut('Ты выпал из кадра');
  }
}

// ---------- render ----------
const grain = document.createElement('canvas');
grain.width = grain.height = 160;
{
  const g = grain.getContext('2d'), img = g.createImageData(160, 160);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
}
const grainPat = ctx.createPattern(grain, 'repeat');

function drawText(pl, alpha, dy = 0, jitter = 0) {
  ctx.globalAlpha = alpha;
  ctx.font = pl.font;
  ctx.fillStyle = pl.color;
  ctx.fillText(pl.text, pl.x + jitter, pl.base + dy);
}

function render(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  const p = S.p, cam = S.camY;
  const flick = REDUCED ? 1 : .94 + .06 * Math.random();
  const wonFade = S.mode === 'won' ? clamp(S.wonT / 1.6, 0, 1) : 0;

  ctx.save();
  ctx.translate(0, -cam);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (const d of deco) {
    if (d.base - cam < -40 || d.base - cam > H + 100) continue;
    ctx.globalAlpha = .8 * flick * (1 - wonFade); ctx.font = d.font; ctx.fillStyle = d.color; ctx.fillText(d.text, d.x, d.base);
  }
  for (const pl of plats) {
    const sy = pl.base - cam;
    if (sy < -40 || sy > H + 120) continue;
    let a = flick * (pl.end ? 1 : 1 - wonFade);
    if (pl.gone) {
      if (pl.goneT >= 1) continue;
      drawText(pl, a * (1 - pl.goneT), pl.goneT * pl.goneT * 160);
      continue;
    }
    const standing = p.ground === pl;
    const shake = pl.fragile && pl.hold > 0 && !REDUCED ? (Math.random() - .5) * 3 * (pl.hold / .55) : 0;
    if (pl.fragile) a *= .62 + .1 * Math.sin(t * .006 + pl.x);
    if (pl.glow || standing) { ctx.shadowColor = 'rgba(255,240,210,.55)'; ctx.shadowBlur = standing ? 14 : 18; }
    drawText(pl, a, 0, shake);
    ctx.shadowBlur = 0;
    if (pl.fragile) {
      // a dashed hairline under a name that will not hold you for long
      ctx.globalAlpha = a * .5; ctx.fillStyle = DIM;
      for (let x = pl.x; x < pl.x + pl.w; x += 6) ctx.fillRect(x + shake, pl.base + 5, 3, 1);
    }
  }
  ctx.globalAlpha = 1;

  // the dot
  if (S.mode !== 'cut') {
    p.trail.forEach((q, i) => {
      ctx.globalAlpha = .25 * (1 - i / p.trail.length);
      ctx.fillStyle = FILM;
      ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(1, 4 - i * .3), 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.shadowColor = '#fff3d6'; ctx.shadowBlur = 16; ctx.fillStyle = '#fffaf0';
    ctx.beginPath(); ctx.arc(p.x + PW / 2, p.y + PH / 2, 5, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.restore();

  // frame edges warm up red as you drift towards them
  if (S.mode === 'play') {
    const sy = p.y - cam;
    const top = clamp(1 - sy / 140, 0, 1), bot = clamp(1 - (H - sy - PH) / 140, 0, 1);
    if (top > 0) { const g = ctx.createLinearGradient(0, 0, 0, 90); g.addColorStop(0, `rgba(255,74,61,${.45 * top})`); g.addColorStop(1, 'rgba(255,74,61,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 90); }
    if (bot > 0) { const g = ctx.createLinearGradient(0, H, 0, H - 90); g.addColorStop(0, `rgba(255,74,61,${.45 * bot})`); g.addColorStop(1, 'rgba(255,74,61,0)'); ctx.fillStyle = g; ctx.fillRect(0, H - 90, W, 90); }
  }

  // film grain, a stray scratch and the vignette
  ctx.save();
  ctx.globalAlpha = .07;
  ctx.globalCompositeOperation = 'screen';
  ctx.translate(Math.random() * 160, Math.random() * 160);
  ctx.fillStyle = grainPat; ctx.fillRect(-160, -160, W + 320, H + 320);
  ctx.restore();
  if (!REDUCED && Math.random() < .02) { ctx.fillStyle = 'rgba(239,232,220,.18)'; ctx.fillRect(Math.random() * W, 0, 1, H); }
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.7)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  if (S.mode === 'title') {
    const band = ctx.createLinearGradient(0, H - 150, 0, H);
    band.addColorStop(0, 'rgba(0,0,0,0)'); band.addColorStop(.45, 'rgba(0,0,0,.92)'); band.addColorStop(1, '#000');
    ctx.fillStyle = band; ctx.fillRect(0, H - 150, W, 150);
    ctx.globalAlpha = .55 + .45 * Math.abs(Math.sin(t * .0022));
    ctx.font = `500 12px ${MONO}`; ctx.fillStyle = DIM;
    ctx.fillText('ПРОБЕЛ ИЛИ КАСАНИЕ — НАЧАТЬ СЕАНС', CX, H - 64);
    ctx.globalAlpha = .7;
    ctx.fillText('титры поедут вверх · держись в кадре · дойди до конца', CX, H - 42);
    ctx.globalAlpha = 1;
  }
  if (S.mode === 'cut') {
    const k = clamp(S.cutT / .15, 0, 1);
    ctx.fillStyle = `rgba(0,0,0,${.75 * k})`; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = k;
    ctx.fillStyle = FILM; ctx.font = `italic 600 64px ${SERIF}`;
    ctx.fillText('Стоп. Снято.', CX, H / 2 - 10);
    ctx.font = `500 13px ${MONO}`; ctx.fillStyle = DIM;
    ctx.fillText(S.cutWhy.toUpperCase(), CX, H / 2 + 26);
    ctx.fillStyle = '#ff4a3d';
    ctx.fillText(`ДУБЛЬ ${S.take}`, CX, H / 2 + 52);
    ctx.globalAlpha = 1;
  }
  if (S.mode === 'won' && S.wonT > 1.2) {
    const k = clamp((S.wonT - 1.2) / 1, 0, 1);
    ctx.globalAlpha = k;
    ctx.font = `italic 500 26px ${SERIF}`; ctx.fillStyle = FILM;
    ctx.fillText('Спасибо за просмотр', CX, H * .22);
    ctx.font = `500 12px ${MONO}`; ctx.fillStyle = DIM;
    ctx.fillText(`ВРЕМЯ ${fmt(S.time)} · ДУБЛЕЙ ${S.take}`, CX, H * .22 + 30);
    if (S.wonT > 2.4) ctx.fillText('ПРОБЕЛ ИЛИ КАСАНИЕ — ЕЩЁ ОДИН СЕАНС', CX, H - 48);
    ctx.globalAlpha = 1;
  }
}

// ---------- hud ----------
function hud() {
  $('take').textContent = S.take;
  $('scene').textContent = S.mode === 'won' ? 'Конец' : checkpoints[S.cp].name;
  $('time').textContent = fmt(S.time);
  const best = +(store.get('gtte-credits-best') || 0);
  $('best').textContent = best ? fmt(best) : '—';
}

// ---------- loop ----------
let last = performance.now(), lastSec = -1;
function frame(t) {
  const dt = Math.min(1 / 30, Math.max(0, (t - last) / 1000)); last = t;
  update(dt);
  render(t);
  const sec = Math.floor(S.time);
  if (sec !== lastSec) { lastSec = sec; $('time').textContent = fmt(S.time); }
  requestAnimationFrame(frame);
}

// ---------- input ----------
function press(k) {
  if (S.mode === 'title') { begin(); return; }
  if (S.mode === 'won') { if (S.wonT > 2.4) { reset(); begin(); } return; }
  if (k === 'jump') S.p.buffer = .12;
}
const MAP = {
  ArrowLeft: 'left', a: 'left', 'ф': 'left',
  ArrowRight: 'right', d: 'right', 'в': 'right',
  ' ': 'jump', ArrowUp: 'jump', w: 'jump', 'ц': 'jump', Enter: 'jump',
};
const keyOf = e => MAP[e.key.length === 1 ? e.key.toLowerCase() : e.key];
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = keyOf(e);
  if (!k) return;
  e.preventDefault();
  if (e.repeat) return;
  keys[k] = true;
  press(k);
});
addEventListener('keyup', e => {
  const k = keyOf(e);
  if (!k) return;
  keys[k] = false;
  // a short tap gives a short hop
  if (k === 'jump' && S.p.vy < 0) S.p.vy *= .5;
});
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; });
cv.addEventListener('pointerdown', () => { if (S.mode === 'title' || S.mode === 'won') press('jump'); });
for (const b of $('pads').querySelectorAll('button')) {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); keys[k] = true; b.classList.add('on'); press(k); };
  const up = () => { keys[k] = false; b.classList.remove('on'); if (k === 'jump' && S.p.vy < 0) S.p.vy *= .5; };
  b.addEventListener('pointerdown', down);
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, up);
}

// ---------- boot: re-measure the words once the typeface arrives ----------
const fontsReady = Promise.race([
  Promise.all([`600 40px ${SERIF}`, `italic 600 30px ${SERIF}`, `500 24px ${SERIF}`, `italic 500 22px ${SERIF}`].map(f => document.fonts.load(f))),
  new Promise(r => setTimeout(r, 1500)),
]).catch(() => {});
reset();
requestAnimationFrame(frame);
fontsReady.then(() => { if (S.mode === 'title') reset(); });
})();
</script>
</body>
</html>
