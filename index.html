<style>
/* Layout: тёмный зал, один экран по центру, под ним табличка с номером сеанса и таймером */
:root {
  --hall: #050405;
  --screen: #000;
  --film: #efe8dc;
  --dim: #8e877c;
  --seat: #1c1719;
  --seat-edge: #2c2427;
  --cut: #ff4a3d;
  --screen-w: min(100%, calc((100dvh - 210px) * 0.8), 560px);
  --f-film: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-slate: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(70% 50% at 50% 30%, #151012 0%, var(--hall) 70%) fixed, var(--hall);
  color: var(--film);
  font-family: var(--f-slate);
  font-size: 13px;
}
.hall {
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen {
  width: var(--screen-w);
  min-width: min(260px, 100%);
  aspect-ratio: 4 / 5;
  background: var(--screen);
  box-shadow: 0 0 0 1px #201a1c, 0 0 80px rgba(239, 232, 220, .07), 0 40px 120px -40px rgba(239, 232, 220, .18);
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.slate {
  width: var(--screen-w);
  margin: 0;
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px;
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.slate b { color: var(--film); font-weight: 500; }
.slate b.late { color: var(--cut); }
.toggles { justify-content: flex-start; gap: 8px; }
.toggle {
  font: 500 11px var(--f-slate); letter-spacing: .14em; text-transform: uppercase;
  color: var(--dim); background: transparent; border: 1px solid var(--seat-edge);
  padding: 6px 10px; cursor: pointer;
}
.toggle:hover { color: var(--film); border-color: var(--dim); }
.toggle[aria-pressed="true"] { color: var(--film); border-color: var(--film); }
.hint { color: #6a625b; letter-spacing: .08em; justify-content: center; text-align: center; text-transform: none; }
.pads { display: none; gap: 10px; width: var(--screen-w); }
/* on a big monitor the screen fills the height of the window */
@media (min-width: 900px) and (min-height: 760px) { :root { --screen-w: min(100%, calc((100dvh - 150px) * 0.8)); } .hint { display: none; } }
body.fs .hall { gap: 8px; padding-block: 8px; }
body.fs { --screen-w: min(100%, calc((100dvh - 70px) * 0.8)); }
body.fs .toggles, body.fs .hint { display: none; }
.slate .cheat { color: var(--cut); }
.pads button {
  flex: 1; height: 58px; font: 500 20px var(--f-slate); color: var(--film);
  background: var(--seat); border: 1px solid var(--seat-edge); border-radius: 0;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
.pads button.on { background: var(--seat-edge); border-color: var(--film); }
.pads .jump { flex: 1.4; }
button:focus-visible { outline: 2px solid var(--film); outline-offset: 2px; }
@media (pointer: coarse) { .pads { display: flex; } .hint { display: none; } }
</style>

// ===== src/js/04-layout.js =====
// ---------- layout: every word on screen is a platform ----------
let LV = LEVELS[0];
let plats = [], deco = [], stars = [], checkpoints = [], props = [], endTop = 0;

function platform(text, font, size, x, base, color, extra = {}) {
  ctx.font = font;
  const fragile = text.startsWith('~');
  if (fragile) text = text.slice(1);
  const m = ctx.measureText(text);
  // stand on the real tops of the letters, whatever the typeface
  const asc = m.actualBoundingBoxAscent || size * .66;
  const p = { text, font, size, x, bx: x, dx: 0, w: m.width, base, top: base - asc, color, fragile, hold: 0, gone: false, goneT: 0, off: false, ...extra };
  if (SOLFEGE[text]) p.note = SOLFEGE[text];
  plats.push(p);
  return p;
}
function measure(text, font) { ctx.font = font; return ctx.measureText(text.replace('~', '')).width; }
function row(words, [font, size, sep], y, color, extra) {
  const ws = words.map(t => measure(t, font));
  const x0 = CX - (ws.reduce((s, v) => s + v, 0) + sep * (words.length - 1)) / 2;
  let x = x0;
  const out = words.map((t, i) => { const p = platform(t, font, size, x, y, color, extra); x += ws[i] + sep; return p; });
  return { out, x0, ws };
}

function layout() {
  plats = []; deco = []; stars = []; checkpoints = []; props = [];
  const f = LV.fonts, P = LV.pal;
  let y = H * .42;
  for (const entry of LV.credits) {
    const [type, ...a] = entry;
    const opt = a.length && typeof a[a.length - 1] === 'object' ? a.pop() : {};
    const extra = {};
    if (opt.blink) Object.assign(extra, { blink: opt.blink, phase: opt.phase || 0 });
    if (opt.sway) Object.assign(extra, { sway: opt.sway, phase: opt.phase || 0 });
    if (type === '*') {
      stars.push({ x: CX + a[0], y: y + a[1], got: false, banked: false });
    } else if (type === 'title') {
      // the title is separate words, the gaps between them are the first way down
      const { out, x0, ws } = row(a[0].split(' '), f.title, y, P.film, { glow: true });
      checkpoints.push({ name: 'Начало', top: out[0].top, x: x0 + ws[0] / 2 });
      y += LINE * 1.6;
    } else if (type === 'h') {
      y += LINE * .45;
      const text = a[0].toUpperCase();
      const p = platform(text, f.head[0], f.head[1], CX - measure(text, f.head[0]) / 2, y, P.film);
      checkpoints.push({ name: a[0], top: p.top, x: CX });
      y += LINE * 1.15;
    } else if (type === 'r') {
      const role = a[0].toUpperCase();
      platform(role, f.role[0], f.role[1], CX - 18 - measure(role, f.role[0]), y, P.dim, extra);
      platform(a[1], f.name[0], f.name[1], CX + 18, y, P.film, extra);
      y += LINE;
    } else if (type === 'c') {
      // a sentence: every word stands apart, so there is always a gap to drop through
      const fragile = a[0].startsWith('~');
      row(a[0].replace('~', '').split(' ').map(t => (fragile ? '~' : '') + t), f.sent, y, P.film, extra);
      y += LINE;
    } else if (type === 'w') {
      const { out } = row(a, f.list, y, P.film, extra);
      out.slice(0, -1).forEach(p => deco.push({ text: '·', font: p.font, x: p.x + p.w + f.list[2] / 2 - 3, base: y, color: P.dim }));
      y += LINE;
    } else if (type === 'end') {
      // THE END stands apart from the rest of the credits
      y += LINE * 2.6;
      const { out } = row(a[0].split(' '), [f.end[0], f.end[1], 20 + f.end[1] * .3], y, P.film, { end: true, glow: true });
      endTop = Math.min(...out.map(p => p.top));
    }
  }
  // in the upside-down session the words of each line alternate between the two worlds
  if (LV.hazard === 'flip') {
    const rows = new Map();
    for (const q of plats) if (!q.glow && !q.end) (rows.get(q.base) || rows.set(q.base, []).get(q.base)).push(q);
    for (const row of rows.values()) if (row.length > 1) row.sort((a, b) => a.x - b.x).forEach((q, i) => { q.world = i % 2 ? 'b' : 'a'; });
  }
  // decorations live in the margins, alternating sides
  let side = Math.random() < .5 ? 0 : 1;
  for (let py = H * .42 + 170, i = 0; py < endTop - 60 && LV.props.length; py += 200 + Math.random() * 160, i++) {
    side ^= 1;
    props.push({ kind: LV.props[i % LV.props.length], x: side ? 482 + Math.random() * 28 : 30 + Math.random() * 28, y: py, s: .85 + Math.random() * .35, ph: Math.random() * 6, n: i, side });
  }
}

  S.mode = 'cut'; S.cutT = 0; S.cutWhy = why; S.take++;

function finishLevel() {
  const got = stars.filter(s => s.got).length;
  const r = { t: +S.time.toFixed(2), par: S.par, got, total: stars.length, takes: S.take };
  if (CHEAT.on) RUN.cheat = true;
  const best = store.json('gtte-best-' + LV.key);
  if (!RUN.cheat && (!best || S.time < best)) {
    store.set('gtte-best-' + LV.key, S.time.toFixed(2));
    store.set('gtte-ghost-' + LV.key, JSON.stringify(S.rec));
  }
  RUN.res[S.li] = r;
  if (RUN.kind === 'marathon') { marathonStep(); hud(); return; }
  if (LV.final) {
    S.mode = 'ending'; S.modeT = 0; S.ending = judge();
    S.endDot = { x: S.p.x + PW / 2, y: S.p.y + PH / 2 - S.camY };

    if (!RUN.cheat) {

      if (!seen.includes(S.ending)) store.set('gtte-endings', JSON.stringify([...seen, S.ending]));
      store.set('gtte-summary-' + S.ending, JSON.stringify(S.summary));
    }
    RUN = freshRun(RUN.kind);
  } else {
    S.mode = 'clear'; S.modeT = 0;
    S.gag = makeGag();

}

  return clamp((S.p.y - a) / ((endTop - a) || 1), 0, 1);

// the verdict on the whole evening
function judge() {
  const res = RUN.res, fast = res.every(r => r.t <= r.par);
  const got = res.reduce((s, r) => s + r.got, 0), total = res.reduce((s, r) => s + r.total, 0);

  S.summary = { fast, got, total, time: res.reduce((s, r) => s + r.t, 0), inTime: res.filter(r => r.t <= r.par).length };
  if (fast && got === total) return 'full';
  if (fast && pct >= .5) return 'almost';

// the doll at the end of the field: move only while she sings
function greenLight() { S.rl = { phase: 'green', t: 0, dur: rand(2.8, 4) }; [392, 392, 440, 392, 523.3, 494].forEach((f, i) => tone(f, .25, .06, i * .17, 'triangle')); }
function updateRedLight(dt) {
  const R = S.rl;
  R.t += dt;
  if (R.phase === 'green' && R.t > R.dur) { R.phase = 'turn'; R.t = 0; tone(880, .15, .1, 0, 'square'); tone(880, .15, .1, .2, 'square'); }
  else if (R.phase === 'turn' && R.t > .55) { R.phase = 'red'; R.t = 0; R.dur = rand(1, 1.5) * (1 + .2 * progress()); }
  else if (R.phase === 'red') {
    const p = S.p, moved = Math.abs(p.vx) > 14 || !p.ground || keys.left || keys.right || p.buffer > 0;
    if (R.t > .15 && moved && S.mode === 'play') { noise(.12, .5, 900); noise(.6, .3, 300, 'lowpass'); cut('Выбыл: ты пошевелился'); return; }
    if (R.t > R.dur) greenLight();
  }
}


// the double walks your own path a second behind you: stand still and you meet yourself
function updateDouble() {
  const d = dotWorld(), D = 1.35 - .35 * progress();
  S.trace.push({ t: S.time, x: d.x, y: d.y });
  while (S.trace.length > 2 && S.trace[1].t <= S.time - D) S.trace.shift();
  S.twin = S.time - S.since >= D ? S.trace[0] : null;
  if (S.twin && Math.hypot(S.twin.x - d.x, S.twin.y - d.y) < 8) cut('Ты встретил себя');
}

// air runs out under water; bubbles rising from the bottom of the frame refill it
function updateOxygen(dt) {
  S.oxy -= (5.5 + 2.5 * progress()) * dt;
  S.bubT -= dt;
  if (S.bubT <= 0) { S.bubT = rand(.6, 1.1); S.bubbles.push({ x: rand(30, W - 30), y: H + 20, r: rand(9, 13), ph: rand(0, 6) }); }
  for (const b of S.bubbles) { b.y -= 75 * dt; b.x += Math.sin(b.y * .03 + b.ph) * .7; }
  const d = dotScreen();
  S.bubbles = S.bubbles.filter(b => {
    if (Math.hypot(b.x - d.x, b.y - d.y) < b.r + 7) {
      S.oxy = Math.min(100, S.oxy + 36);
      tone(988, .18, .07); tone(1318, .2, .05, .06);
      burst(b.x, b.y + S.camY, 8, '#bfefff', 90, 3);
      return false;
    }
    return b.y > -30;
  });
  S.beep -= dt;
  if (S.oxy < 30 && S.beep <= 0) { S.beep = .8; tone(1046, .12, .08, 0, 'square'); }
  if (S.oxy <= 0) cut('Кончился кислород');
}

// the upside-down: every few seconds the world flips, and words of the other world stop holding you
function updateFlip(dt) {
  S.flipT -= dt;
  if (S.flipT < .8 && !S.flipWarn) { S.flipWarn = true; tone(1046, .1, .06, 0, 'square'); tone(1046, .1, .06, .2, 'square'); tone(1046, .1, .06, .4, 'square'); }
  if (S.flipT <= 0) {
    S.world = S.world === 'a' ? 'b' : 'a'; S.flipWarn = false;
    S.flipT = rand(3.2, 4.2) * (1 - .15 * progress());
    sweep(S.world === 'b' ? 300 : 120, S.world === 'b' ? 80 : 300, .5, .08, 'sawtooth'); S.shake = .25;
    if (S.p.ground && !solid(S.p.ground)) S.p.ground = null;
  }
}

// the dinosaur park: the ground shakes before every stomp, and the jaw at the top bites now and then
function jawDepth() { const L = S.rex.lunge; return L > 0 ? 130 * Math.sin(clamp((.6 - L) / .6, 0, 1) * Math.PI) : 0; }
function updateRex(dt) {
  const R = S.rex, p = S.p;
  R.next -= dt;
  if (R.next < .6 && !R.warn) { R.warn = 1; noise(.4, .3, 120, 'lowpass'); }
  if (R.next <= 0) {
    R.warn = 0; R.n++;
    R.next = rand(2.3, 3.2) * (1 - .2 * progress());
    noise(.5, .7, 90, 'lowpass'); S.shake = .4;
    if (p.ground) { p.vy = -380; p.ground = null; }
    for (const q of plats) if (q.fragile && !q.gone && q.top - S.camY > 0 && q.top - S.camY < H) q.hold += .25;
    if (R.n % 3 === 0) { R.lungeAt = 1; sweep(140, 50, 1, .2, 'sawtooth'); }
  }
  if (R.lungeAt > 0) { R.lungeAt -= dt; if (R.lungeAt <= 0) R.lunge = .6; }
  if (R.lunge > 0) R.lunge -= dt;
}

// the night shift: a torch around the dot, and robots that only move in the dark
function freshNight() { return { off: 0, nextOff: rand(4, 6), bots: [{ x: 30, y: H - 40 }, { x: W - 30, y: 40 }], third: false, flick: 0 }; }
function torchR() { const N = S.night; return N.off > 0 ? 34 : 128 - (N.nextOff < .7 && Math.random() < .5 ? 60 : 0); }
function updateNight(dt) {
  const N = S.night;
  if (S.mode === 'clear') { N.off = 0; return; }
  N.nextOff -= dt;
  if (N.nextOff < .7 && N.nextOff > 0 && Math.random() < .2) noise(.05, .08, 4000);
  if (N.nextOff <= 0) { N.off = .7; N.nextOff = rand(4.5, 6.5) * (1 - .15 * progress()); noise(.3, .3, 200, 'lowpass'); }
  if (N.off > 0) N.off -= dt;
  if (!N.third && progress() > .5) { N.third = true; N.bots.push({ x: W - 30, y: H - 40 }); }
  const d = dotScreen(), r = torchR(), v = 62 + 30 * progress();
  for (const b of N.bots) {
    const dist = Math.hypot(d.x - b.x, d.y - b.y);
    b.lit = dist < r * .95;
    // in the dark they come closer; caught in the torch they back away
    const sp = b.lit ? -32 : v;
    b.x = clamp(b.x + (d.x - b.x) / dist * sp * dt, 10, W - 10); b.y = clamp(b.y + (d.y - b.y) / dist * sp * dt, 10, H - 10);
    if (dist < 17) { S.jump = 1; cut('Тебя поймал аниматроник'); return; }
  }
}

// the snap: half of the words on screen turn to dust and come back a few seconds later
function updateSnap(dt) {
  S.snapT -= dt;
  if (S.snapT < .9 && !S.snapWarn) { S.snapWarn = true; tone(392, .5, .06, 0, 'sine'); tone(523, .5, .06, .25, 'sine'); }
  if (S.snapT <= 0) {
    S.snapWarn = false; S.snapT = rand(3.8, 5) * (1 - .15 * progress());
    noise(.08, .6, 2500); noise(.6, .2, 400, 'lowpass');
    const vis = plats.filter(q => !q.end && !q.glow && !q.gone && !(q.dust > 0) && q.base - S.camY > 0 && q.top - S.camY < H && checkpoints.every(c => c.top !== q.top));
    for (const q of vis) if (Math.random() < .5) {
      q.dust = 3.2;
      for (let i = 0; i < 10; i++) S.parts.push({ x: q.x + Math.random() * q.w, y: q.top + Math.random() * (q.base - q.top), vx: rand(20, 90), vy: rand(-30, 10), life: rand(.8, 1.6), t: 0, color: pick(['#8a6a52', '#6b5040', '#b49478']), size: 2 });
      if (S.p.ground === q) S.p.ground = null;
    }
  }
}

function updateHazards(dt) {
  const type = LV.hazard, H_ = HZ[type];
  if (S.mode === 'play' && type === 'redlight') updateRedLight(dt);
  if (S.mode === 'play' && type === 'water') S.water = Math.min(330, S.water + (7 + 11 * progress()) * dt);
  if (S.mode === 'play' && type === 'double') { updateDouble(); if (S.mode !== 'play') return; }
  if (S.mode === 'play' && LV.oxygen) { updateOxygen(dt); if (S.mode !== 'play') return; }
  if (S.mode === 'play' && type === 'flip') updateFlip(dt);
  if (S.mode === 'play' && type === 'rex') updateRex(dt);
  if ((S.mode === 'play' || S.mode === 'clear') && type === 'dark') { updateNight(dt); if (S.mode === 'cut') return; }
  if (S.mode === 'play' && type === 'snap') updateSnap(dt);
  if (type === 'snap') for (const q of plats) if (q.dust > 0) { q.dust -= dt; if (q.dust <= 0) { q.dust = 0; q.back = .5; } } else if (q.back > 0) q.back -= dt;
  if (S.mode === 'play') { mech('update', dt); if (S.mode !== 'play') return; }
  if (!H_ || !H_.spawn) return;
  if (S.mode === 'play') {
    S.hzT -= dt;
    if (S.time > 1.8 && S.hzT <= 0) {
      H_.spawn();
      S.hzT = H_.every * (1 - .42 * progress()) * (1 - .015 * S.li) + Math.random() * .35;
    }
  }
  for (const h of S.hz) {
    h.t += dt;
    if (!h.live && h.t >= h.warn) { h.live = true; if (HZ[h.type].onLive) HZ[h.type].onLive(h); }
    HZ[h.type].step(h, dt);
  }
  if (S.mode === 'play') {
    const dw = dotWorld(), ds = dotScreen();
    for (const h of S.hz) if (HZ[h.type].hit(h, h.screen ? ds : dw)) { cut(HZ[h.type].why); return; }
  }
  S.hz = S.hz.filter(h => h.t < 30 && !HZ[h.type].dead(h));
}

// ===== src/js/08-update.js =====
// ---------- update ----------
function update(dt) {
  const p = S.p;
  if (S.mode === 'pause' || S.mode === 'menu') return;
  S.modeT += dt;
  S.shake = Math.max(0, S.shake - dt);
  for (const pl of plats) if (pl.gone && pl.goneT < 1) pl.goneT += dt * 1.4;
  S.ripples = S.ripples.filter(r => (r.t += dt) < .6);
  S.floaters = S.floaters.filter(f => (f.t += dt) < 1);
  if (S.mode === 'clear' && S.gag) updateGag(dt);
  S.parts = S.parts.filter(q => (q.t += dt) < q.life);
  for (const q of S.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 500 * dt; }
  if (S.mode === 'cut') { S.cutT += dt; if (S.cutT > 1.45) respawn(); return; }
  if (S.mode === 'intro') { if (S.modeT > (S.quick ? 1.6 : 3)) play(); return; }
  // in the marathon the next reel is threaded on its own
  if (S.mode === 'clear' && RUN.kind === 'marathon' && !S.mdone && S.modeT > 2.6) { nextFilm(); return; }
  if (S.mode === 'ending') { updateEnding(dt); return; }
  S.clock += dt;

  // moving and blinking lines
  for (const pl of plats) {
    if (pl.sway) { const nx = pl.bx + pl.sway * Math.sin(S.clock * 1.25 + pl.phase); pl.dx = nx - pl.x; pl.x = nx; }
    if (pl.blink) pl.off = (S.clock + pl.phase) % pl.blink > pl.blink * .68;
  }

  if (S.mode === 'play') {
    S.time += dt;
    // credits roll faster the closer you get to the end, and stop once THE END is in the frame
    if (!mech('frozen')) S.camY = Math.min(S.camY + (44 + 52 * progress()) * (LV.speed || 1) * dt, endTop - H * .6);
  }

  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const target = S.mode === 'play' ? dir * SPEED : 0;
  p.vx += clamp(target - p.vx, -ACC * dt, ACC * dt);
  p.coyote = p.ground ? .09 : Math.max(0, p.coyote - dt);
  p.buffer = Math.max(0, p.buffer - dt);
  if (p.buffer > 0 && p.coyote > 0 && S.mode === 'play') {
    p.vy = -JUMP * (LV.jump || 1); p.buffer = 0; p.coyote = 0; p.ground = null;
  }
  // under water a jump in mid-air is a swimming stroke, and every stroke costs a little air
  S.swimCD = Math.max(0, S.swimCD - dt);
  if (LV.swim && S.mode === 'play' && !p.ground && p.buffer > 0 && S.swimCD <= 0) {
    p.vy = Math.min(p.vy, -JUMP * .52); p.buffer = 0; S.swimCD = .3; S.oxy -= 2.5;
    sweep(260, 420, .14, .05, 'sine'); burst(p.x + PW / 2, p.y + PH, 4, '#bfefff', 60, 3);
  }
  p.vy = Math.min(MAXFALL * (LV.fall || 1), p.vy + GRAV * (LV.grav || 1) * dt);

  // a swaying line carries whoever stands on it
  if (p.ground && p.ground.sway) p.x += p.ground.dx;
  const prevGround = p.ground, impact = p.vy;
  const prevBottom = S.prevBottom = p.y + PH;
  p.x = clamp(p.x + p.vx * dt, 0, W - PW);
  p.y += p.vy * dt;

  // one-way platforms: land on a word only while falling onto its top
  p.ground = null;
  if (p.vy >= 0) {
    let best = null;
    for (const pl of plats) {
      if (!solid(pl) || p.x + PW <= pl.x || p.x >= pl.x + pl.w) continue;
      if (prevBottom <= pl.top + .5 && p.y + PH >= pl.top && (!best || pl.top < best.top)) best = pl;
    }
    if (best) {
      p.y = best.top - PH; p.vy = 0; p.ground = best;
      if (!prevGround) {
        const k = clamp(impact / MAXFALL, 0, 1);
        p.squash = .3 + .7 * k;
        landNote(best, k);
        S.ripples.push({ x: p.x + PW / 2, y: best.top, t: 0, k });
        mech('land', best);
        if (k > .45) burst(p.x + PW / 2, p.y + PH, 5, LV.pal.dim, 60);
      }
    }
  }
  mech('constrain', p);
  p.squash = Math.max(0, p.squash - dt * 6);

  // in the doll's game everything freezes on red, the crumbling names too
  const frozen = LV.hazard === 'redlight' && S.rl.phase === 'red' || mech('frozen');
  if (p.ground && p.ground.fragile && !frozen) {
    p.ground.hold += dt;
    if (p.ground.hold > .5) { p.ground.gone = true; p.ground = null; noise(.18, .18, 1800); }
  }
  if (p.ground && p.ground.end && S.mode === 'play') { finishLevel(); return; }

  for (let i = S.cp + 1; i < checkpoints.length; i++) if (p.y > checkpoints[i].top) {
    S.cp = i;
    for (const s of stars) if (s.got) s.banked = true;
    tone(523.3, 1.2, .1);
    hud();
  }

  if (S.mode === 'play') {
    const cx = p.x + PW / 2, cy = p.y + PH / 2;
    for (const s of stars) if (!s.got && Math.hypot(s.x - cx, s.y - cy) < 16) {
      s.got = true;
      burst(s.x, s.y, 12, LV.pal.star, 150);
      S.floaters.push({ x: s.x, y: s.y, t: 0, text: '+1' });
      mech('collect', s);
      tone(1318.5, .5, .06); tone(1975.5, .7, .05, .08);
      hud();
    }
  }

  p.trail.unshift({ x: p.x + PW / 2, y: p.y + PH / 2 });
  if (p.trail.length > 20) p.trail.pop();

  updateHazards(dt);
  if (S.mode !== 'play') return;

  while (S.recT <= S.time) { S.rec.push(Math.round(p.x), Math.round(p.y)); S.recT += 1 / REC_HZ; }
  // the camera chases a falling dot, but slower than it falls: a short slip is forgiven, a long drop is not
  const floor = H - (LV.hazard === 'water' ? S.water : 0);
  const chaseLine = Math.min(H * .68, floor - 120);
  const low = p.y - S.camY - chaseLine;
  if (low > 0) S.camY = Math.min(S.camY + Math.min(low, 250 * dt), endTop - H * .6);
  const sy = p.y - S.camY;
  if (LV.hazard === 'rex' && S.rex.lunge > 0 && sy < jawDepth()) cut('Тебя съел тираннозавр');
  else if (sy + PH < -2) cut('Тебя унесло за верх кадра');
  else if (LV.hazard === 'water' && sy + PH > floor + 3) cut('Ты утонул');
  else if (sy > H + 2) cut('Ты выпал из кадра');
}

// darkness with a torch around the dot; the robots' eyes always show

// the gauntlet at the top: its stones light up one by one before a snap

// ---------- render ----------
const grain = document.createElement('canvas');
grain.width = grain.height = 160;
{
  const g = grain.getContext('2d'), img = g.createImageData(160, 160);

const grainPat = ctx.createPattern(grain, 'repeat');

function drawText(pl, alpha, dy = 0, jitter = 0) {
  ctx.globalAlpha = alpha;
  ctx.font = pl.font;
  // cartoon films wobble like rubber, the neon film splits its colours like a worn tape
  if (LV.wobble) dy += Math.sin(performance.now() * .004 + pl.x * .05) * 1.6;
  if (LV.pal.shadow) { ctx.fillStyle = LV.pal.shadow; ctx.fillText(pl.text, pl.x + jitter + 2, pl.base + dy + 2); }
  if (LV.chroma) { const a0 = ctx.globalAlpha; ctx.globalAlpha = a0 * .55; ctx.fillStyle = '#ff2ad8'; ctx.fillText(pl.text, pl.x + jitter - 1.6, pl.base + dy); ctx.fillStyle = '#00f0ff'; ctx.fillText(pl.text, pl.x + jitter + 1.6, pl.base + dy); ctx.globalAlpha = a0; }
  if (LV.pal.outline && (pl.glow || pl.size >= 26)) {
    // red outlined titles, the way that show sets its name
    ctx.shadowColor = LV.pal.outline; ctx.shadowBlur = 12; ctx.strokeStyle = LV.pal.outline; ctx.lineWidth = 1.6;
    ctx.strokeText(pl.text, pl.x + jitter, pl.base + dy); ctx.fillStyle = 'rgba(10,6,10,.9)'; ctx.fillText(pl.text, pl.x + jitter, pl.base + dy);
    return;
  }
  ctx.fillStyle = pl.color;
  ctx.fillText(pl.text, pl.x + jitter, pl.base + dy);
}
function caption(text, font, y, color, alpha = 1) {
  ctx.globalAlpha = alpha; ctx.font = font; ctx.fillStyle = color; ctx.fillText(text, CX, y); ctx.globalAlpha = 1;
}

function render(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  const P = LV.pal;
  ctx.fillStyle = P.bg;
  ctx.fillRect(0, 0, W, H);
  if (S.mode === 'menu') { drawMenu(t); finish(t); drawReel(t); return; }
  const p = S.p, cam = S.camY;
  const still = S.mode === 'pause';
  const flick = REDUCED || still ? 1 : .95 + .05 * Math.random();
  // after THE END of a guest film the world keeps going; only the finale fades into its ending
  const fade = S.mode === 'ending' ? clamp(S.modeT / 1.6, 0, 1) : 0;
  if (S.shake > 0 && !REDUCED) ctx.translate((Math.random() - .5) * 14 * S.shake, (Math.random() - .5) * 14 * S.shake);

  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  if (LV.back) BACK[LV.back](t, cam, 1 - fade);
  ctx.globalAlpha = 1;
  drawBeam(t, 1 - fade);

  ctx.save();
  ctx.translate(0, -cam);
  drawProps(t, cam);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (const d of deco) {
    if (d.base - cam < -40 || d.base - cam > H + 100) continue;
    ctx.globalAlpha = .8 * flick * (1 - fade); ctx.font = d.font; ctx.fillStyle = d.color; ctx.fillText(d.text, d.x, d.base);
  }
  const dx0 = p.x + PW / 2, dy0 = p.y + PH / 2;
  for (const pl of plats) {
    const sy = pl.base - cam;
    if (sy < -40 || sy > H + 120) continue;
    if (pl.block) { ctx.globalAlpha = 1; drawBlock(pl.x, pl.top, pl.block); continue; }
    if (pl.end && S.gag) continue;
    let a = flick * (pl.end ? 1 : 1 - fade);
    // the other world's words, and words turned to dust
    if (pl.world && pl.world !== S.world) a *= .16;
    if (pl.dust > 0) a *= clamp((pl.dust - 2.7) / .5, 0, 1);
    else if (pl.back > 0) a *= 1 - pl.back / .5;
    if (a <= .01) continue;
    if (pl.gone) {
      if (pl.goneT >= 1) continue;
      drawText(pl, a * (1 - pl.goneT), pl.goneT * pl.goneT * 160);
      continue;
    }
    if (pl.blink) {
      // a dying bulb: stutters just before it goes dark
      const ph = (S.clock + pl.phase) % pl.blink;
      if (pl.off) a *= .12;
      else if (ph > pl.blink * .52 && !REDUCED && !still) a *= Math.random() < .5 ? .35 : 1;
    }
    const standing = p.ground === pl;
    const shake = pl.fragile && pl.hold > 0 && !REDUCED ? (Math.random() - .5) * 3 * (pl.hold / .5) : 0;
    if (pl.fragile) a *= .62 + .1 * Math.sin(t * .006 + pl.x);
    // words light up as the dot comes near them
    const near = Math.max(0, 1 - Math.hypot(pl.x + pl.w / 2 - dx0, pl.top - dy0) / 110);
    if (pl.glow || standing || near > 0) { ctx.shadowColor = P.light ? 'rgba(0,0,0,.25)' : P.glowCol || 'rgba(255,240,210,.55)'; ctx.shadowBlur = standing ? 16 : pl.glow ? 18 : 12 * near; }
    drawText(pl, a, 0, shake);
    ctx.shadowBlur = 0;
    if (pl.fragile) {
      // a dashed hairline under a name that will not hold you for long
      ctx.globalAlpha = a * .6; ctx.fillStyle = P.dim;
      for (let x = pl.x; x < pl.x + pl.w; x += 6) ctx.fillRect(x + shake, pl.base + 5, 3, 1.2);
    }
  }

  for (const s of stars) {
    if (s.got || s.y - cam < -30 || s.y - cam > H + 30) continue;
    ctx.globalAlpha = (.8 + .2 * Math.sin(t * .006 + s.y)) * (1 - fade);
    drawCollectible(s.x, s.y + (REDUCED ? 0 : Math.sin(t * .003 + s.x) * 2.5), t);
  }
  ctx.globalAlpha = 1;

  drawHazards(t, cam);
  if (S.mode === 'clear' && S.gag) drawGagWorld(t);

  // your double, a second behind
  if (S.twin && S.mode === 'play') {
    const j = REDUCED ? 0 : (Math.random() - .5) * 2;
    ctx.globalAlpha = Math.random() < .1 ? .4 : .95;
    ctx.shadowColor = P.accent; ctx.shadowBlur = 18;
    circle(S.twin.x + j, S.twin.y, 7, 'rgba(255,95,162,.35)');
    circle(S.twin.x + j, S.twin.y, 3.5, '#1a1a12');
    ctx.strokeStyle = P.accent; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(S.twin.x + j, S.twin.y, 7, 0, PI2); ctx.stroke();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  // the ghost of your best take
  if (S.ghost && (S.mode === 'play' || S.mode === 'cut')) {
    const i = Math.floor(S.time * REC_HZ) * 2;
    if (i + 1 < S.ghost.length) {
      ctx.globalAlpha = .35; ctx.strokeStyle = P.film; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(S.ghost[i] + PW / 2, S.ghost[i + 1] + PH / 2, 5, 0, PI2); ctx.stroke();
    }
  }

  for (const q of S.parts) {
    ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  // rings where the dot lands, and +1 over collected stars
  for (const r of S.ripples) {
    const k = r.t / .6;
    ctx.globalAlpha = (1 - k) * (.35 + .4 * r.k); ctx.strokeStyle = P.light ? '#ffffff' : P.film; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, 6 + 30 * k, 1.5 + 5 * k, 0, 0, PI2); ctx.stroke();
  }
  for (const f of S.floaters) {
    ctx.globalAlpha = 1 - f.t; ctx.fillStyle = f.col || P.star; ctx.font = `600 ${f.text.length > 3 ? 11 : 14}px ${MONO}`; ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y - 10 - f.t * 30); ctx.textAlign = 'left';
  }
  ctx.globalAlpha = 1;

  // the dot
  const hideDot = S.mode === 'cut' || S.mode === 'ending' && (S.ending === 'truck' || S.ending === 'full' && S.modeT > 2.4);
  if (!hideDot) {
    p.trail.forEach((q, i) => {
      ctx.globalAlpha = .25 * (1 - i / p.trail.length);
      ctx.fillStyle = P.light ? '#ffffff' : P.film;
      ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(1, 4 - i * .15), 0, PI2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    // the dot: a soft halo tinted by the film, a hot core; a red heart in the film about mercy
    const sq = p.squash, cx = p.x + PW / 2, cy = p.y + PH / 2 + sq * 2;
    if (LV.soulHeart) drawSoul(cx, cy); else {
    const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, 24);
    halo.addColorStop(0, P.light ? 'rgba(255,255,255,.55)' : 'rgba(255,246,225,.42)'); halo.addColorStop(.45, hexA(P.accent, .14)); halo.addColorStop(1, hexA(P.accent, 0));
    ctx.fillStyle = halo; ctx.fillRect(cx - 24, cy - 24, 48, 48);
    ctx.shadowColor = P.light ? 'rgba(0,0,0,.5)' : '#fff3d6'; ctx.shadowBlur = 16; ctx.fillStyle = '#fffaf0';
    ctx.beginPath(); ctx.ellipse(cx, cy, 5 * (1 + .45 * sq), 5 * (1 - .4 * sq), 0, 0, PI2); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(cx - 1.2, cy - 1.4, 1.6, 0, PI2); ctx.fill();
    }
  }
  ctx.restore();

  if (LV.hazard === 'water' && S.mode !== 'ending') drawWater(t);
  if (LV.oxygen && S.mode !== 'ending') drawOxygen(t);
  if (LV.hazard === 'redlight' && (S.mode === 'play' || S.mode === 'pause' || S.mode === 'cut')) drawDoll();
  const live = S.mode === 'play' || S.mode === 'pause' || S.mode === 'cut';
  if (LV.hazard === 'flip' && S.mode !== 'ending') drawFlip(t);
  if (LV.hazard === 'rex' && live) drawRex(t);
  if (LV.hazard === 'dark' && live) drawNight(t);
  if (LV.hazard === 'snap' && live) drawGauntlet(t);
  if (S.mode !== 'ending') mech('draw', t);
  if (S.mode === 'clear' && S.gag) drawGagScreen(t);
  drawGrade();
  if (LV.sepia) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgba(190,140,80,.35)'; ctx.fillRect(0, 0, W, H); ctx.restore(); }

  // frame edges warm up red as you drift towards them
  if (S.mode === 'play') {
    const sy = p.y - cam, floor = H - (LV.hazard === 'water' ? S.water : 0);
    const top = clamp(1 - sy / 140, 0, 1), bot = clamp(1 - (floor - sy - PH) / 140, 0, 1);

  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  if (S.mode === 'ending') { drawEnding(t); finish(t, true); drawReel(t); return; }
  finish(t, P.light);
  if (S.mode === 'intro') drawIntro();
  if (S.mode === 'cut') drawCut();
  if (S.mode === 'clear') drawClear();
  if (S.mode === 'pause') {

    caption('Пауза', `italic 500 44px ${SERIF}`, H / 2 - 6, '#efe8dc');

    if (RUN.kind === 'marathon') caption('Q — ВЫЙТИ ИЗ МАРАФОНА', `500 12px ${MONO}`, H / 2 + 48, '#8e877c');
  }
  drawReel(t);
}

// film grain, a stray scratch and the vignette
function finish(t, light) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  ctx.globalAlpha = light ? .05 : .07;
  ctx.globalCompositeOperation = light ? 'multiply' : 'screen';
  if (S.mode !== 'pause') ctx.translate(Math.random() * 160, Math.random() * 160);
  ctx.fillStyle = grainPat; ctx.fillRect(-160, -160, W + 320, H + 320);
  ctx.restore();
  if (!REDUCED && S.mode !== 'pause' && Math.random() < .02) { ctx.fillStyle = 'rgba(239,232,220,.18)'; ctx.fillRect(Math.random() * W, 0, 1, H); }
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${light ? .25 : .7})`);

function makeGag() {
  const ends = plats.filter(q => q.end), letters = [];
  for (const pl of ends) {
    ctx.font = pl.font;
    // place each letter by the width of the text before it, so kerning and spacing stay as set
    [...pl.text].forEach((ch, i) => {
      const x = pl.x + ctx.measureText(pl.text.slice(0, i)).width, w = ctx.measureText(pl.text.slice(0, i + 1)).width - (x - pl.x);
      letters.push({ ch, x, w, base: pl.base, font: pl.font, color: pl.color, dx: 0, dy: 0, vx: 0, vy: 0, a: 1, rot: 0, sc: 1, tint: null, word: ends.indexOf(pl), h: pl.size });
    });
  }
  const g = { letters, x0: Math.min(...letters.map(l => l.x)), x1: Math.max(...letters.map(l => l.x + l.w)), base: ends[0].base, top: Math.min(...ends.map(q => q.top)), size: ends[0].size, cues: new Set(), say: '', sayCol: null, fx: [] };
  const G = GAGS[LV.key];

}
function gcue(g, id, at, fn) { if (S.modeT >= at && !g.cues.has(id)) { g.cues.add(id); fn(); } }

    ctx.font = l.font;

}

function cue(id, at, fn) { if (S.modeT >= at && !S.cues.has(id)) { S.cues.add(id); fn(); } }
// the dot leaps off THE END and hangs in the air in slow motion
const IMPACT = 2.45;
function truckDot(T) {
  const d0 = S.endDot, tau = T < .35 ? T : .35 + (Math.min(T, IMPACT) - .35) * .16;
  return { x: d0.x + 60 * tau, y: d0.y - 560 * tau + 520 * tau * tau };
}
function truckFront(T) {
  const hit = truckDot(IMPACT);
  if (T < 1.55) return -60;
  if (T < IMPACT) { const k = (T - 1.55) / (IMPACT - 1.55); return -60 + (hit.x + 8 + 60) * k * k; }
  if (T < IMPACT + .12) return hit.x + 8;          // a heartbeat of hit-stop
  return hit.x + 8 + (T - IMPACT - .12) * 1500;
}
function updateEnding(dt) {
  const e = S.ending;
  if (e === 'truck') {
    cue('horn', 1.55, horn);
    cue('crash', IMPACT, () => {
      noise(1.2, .85, 1400, 'lowpass'); noise(.35, .5, 3000); S.shake = .6;
      const d = truckDot(IMPACT);
      // a cartoon burst of blood, mostly carried along with the truck
      S.blood = Array.from({ length: 110 }, () => ({ x: d.x, y: d.y, vx: rand(-120, 760), vy: rand(-420, 200), r: rand(1.5, 5.5), t: 0, life: rand(.6, 1.6) }));
      S.splats = Array.from({ length: 11 }, (_, i) => ({ x: d.x + rand(30, 300), y: d.y + rand(-140, 160), r: rand(6, 20), drip: rand(20, 80), t0: IMPACT + .08 + i * .025 }));
      S.splats.push({ x: rand(440, 510), y: rand(40, 110), r: 34, drip: 120, t0: IMPACT + .2 }, { x: rand(30, 90), y: rand(560, 630), r: 26, drip: 60, t0: IMPACT + .26 });
    });
    for (const b of S.blood) { b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 900 * dt; }
  }
  if (e === 'late') for (let i = 1; i < 9; i++) cue('tick' + i, i, () => noise(.03, .25, 4000));
  if (e === 'blind') cue('whoosh', .1, () => noise(1.8, .25, 700, 'bandpass'));
  if (e === 'almost') cue('lights', 1, () => tone(392, 2.5, .08));
  if (e === 'full') {

    cue('begin', 8.6, () => [0, 4, 7, 11, 14].forEach((s, i) => tone(392 * Math.pow(2, s / 12), 3, .06, i * .09)));
  }
  cue('message', ENDING_LEN[e] - 2.6, () => tone(523.3, 2.2, .1));

function lines(T, rows, color, glow) {
  for (const [t0, text, font, y, col] of rows) {
    const k = clamp((T - t0) / .8, 0, 1);
    if (k <= 0) continue;
    if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 8; }

}
function endingStats(T, at, color, y = H - 92) {
  const s = S.summary;
  if (T > at) caption(`ВРЕМЯ ${fmt(s.time)} · В ГРАФИКЕ ${s.inTime}/${EVENING} · ★ ${s.got}/${s.total}`, `500 12px ${MONO}`, y, color, clamp((T - at) / .8, 0, 1));
  if (T > at + 1) caption('ПРОБЕЛ — ПРОЖИТЬ ЕЩЁ РАЗ', `500 12px ${MONO}`, y + 30, color, clamp((T - at - 1) / .8, 0, 1));
}
const MOTTO = 'ТОРОПИСЬ ЖИТЬ. ЖИЗНЬ ОДНА.';

function drawSplat(s, T) {
  const k = clamp((T - s.t0) / .12, 0, 1);
  if (k <= 0) return;
  // the stains soften once the words arrive, so they can be read
  ctx.globalAlpha = 1 - .72 * clamp((T - 3.5) / .8, 0, 1);
  ctx.fillStyle = '#9d0012';
  ctx.beginPath(); ctx.arc(s.x, s.y, s.r * k, 0, PI2); ctx.fill();
  for (let i = 0; i < 6; i++) { const a = i * 1.1 + s.r, d = s.r * (1 + .4 * (i % 3)); circle(s.x + Math.cos(a) * d * k, s.y + Math.sin(a) * d * k, s.r * .28 * k, '#9d0012'); }
  const drip = s.drip * clamp((T - s.t0 - .2) / 3, 0, 1);
  if (drip > 0) { ctx.fillRect(s.x - s.r * .18, s.y, s.r * .36, drip); circle(s.x, s.y + drip, s.r * .26, '#9d0012'); }
  ctx.globalAlpha = 1;
}

function drawEnding(t) {
  const T = S.modeT, e = S.ending, big = `italic 600 34px ${SERIF}`, mid = `italic 500 21px ${SERIF}`, motto = `600 22px ${MONO}`;
  const y0 = H * .26;
  if (e === 'truck') {
    // anime white-out: the dot hangs in the air in slow motion, the frame bleaches, a truck comes from the left
    const white = clamp((T - .3) / 1.7, 0, 1);
    ctx.fillStyle = `rgba(255,255,255,${.94 * white})`; ctx.fillRect(0, 0, W, H);
    const d = truckDot(T);
    if (T < IMPACT && !REDUCED) {
      ctx.strokeStyle = `rgba(0,0,0,${.22 * white})`; ctx.lineWidth = 1;
      for (let i = 0; i < 56; i++) {
        const a = i / 56 * PI2 + Math.sin(i * 7.1) * .05, r0 = 70 + (i * 37 % 90) + (t * .3 % 50);
        ctx.beginPath(); ctx.moveTo(d.x + Math.cos(a) * r0, d.y + Math.sin(a) * r0); ctx.lineTo(d.x + Math.cos(a) * 800, d.y + Math.sin(a) * 800); ctx.stroke();
      }
    }
    if (T < IMPACT + .05) {

      circle(d.x, d.y, 6, '#fffaf0'); ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(d.x, d.y, 6, 0, PI2); ctx.stroke();

      drawTruckSide(front, hit.y + 74, T < IMPACT);

    }
    ctx.globalAlpha = 1;
    if (T > IMPACT && T < IMPACT + .25) { ctx.fillStyle = `rgba(255,255,255,${.8 * (1 - (T - IMPACT) / .25)})`; ctx.fillRect(0, 0, W, H); }
    lines(T, [
      [4.0, 'Тебя сбил грузовик.', big, y0],
      [5.2, 'Ты слишком долго смотрел чужие титры', mid, y0 + 48],
      [5.8, 'и почти ничего не успел собрать.', mid, y0 + 76],

    const rise = ease(clamp(T / 2.5, 0, 1));
    ctx.fillStyle = '#16110f';
    for (let r = 0; r < 3; r++) for (let i = 0; i < 9; i++) {
      const x = 20 + i * 58 + (r % 2) * 29, y = H - 40 - r * 46 + (1 - rise) * 160;
      rr(x, y, 44, 60, 10); ctx.fill();
    }
    lines(T, [
      [1.6, 'Ты собрал почти всё, что видел.', big, y0],
      [3.0, 'Но смотрел слишком долго.', mid, y0 + 48],
      [4.2, 'Зал опустел. Сеанс давно закончился.', mid, y0 + 76],
      [6.4, MOTTO, motto, y0 + 150, CUT],

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? few : many;
}

// every star of the evening flies home, the dot becomes the sun, and the end turns into a beginning
function drawFull(t, T) {
  const p = S.p, dot = { x: p.x + PW / 2, y: p.y + PH / 2 - S.camY };
  const n = S.summary.total;
  if (T < 2.6) {
    ctx.fillStyle = `rgba(0,0,0,${clamp(T / 1, 0, .7)})`; ctx.fillRect(0, 0, W, H);
    ctx.font = `500 16px ${SERIF}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < n; i++) {
      const k = ease(clamp((T - i * (1.6 / n)) / .9, 0, 1));
      if (k >= 1) continue;
      const a = i * 2.399, R = 420 * (1 - k);
      ctx.globalAlpha = .9; ctx.fillStyle = '#fff6df'; ctx.shadowColor = '#fff1c8'; ctx.shadowBlur = 10;
      ctx.fillText('★', dot.x + Math.cos(a + k * 2) * R, dot.y + Math.sin(a + k * 2) * R);
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
    const glow = 6 + 30 * clamp(T / 2.4, 0, 1);
    ctx.shadowColor = '#fff1c8'; ctx.shadowBlur = glow * 2; ctx.fillStyle = '#fffaf0';
    ctx.beginPath(); ctx.arc(dot.x, dot.y, 5 + glow * .25, 0, PI2); ctx.fill(); ctx.shadowBlur = 0;
    return;
  }
  // dawn
  const k = ease(clamp((T - 2.6) / 4, 0, 1));
  const mix = (a, b) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const top = mix([6, 7, 20], [70, 120, 190]), bot = mix([20, 12, 30], [255, 183, 110]);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, `rgb(${top})`); sky.addColorStop(1, `rgb(${bot})`);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  const flash = clamp(1 - (T - 2.6) / .6, 0, 1);
  const sunY = H * .78 - (H * .3) * k, sunR = 12 + 46 * k;
  const sg = ctx.createRadialGradient(CX, sunY, 0, CX, sunY, sunR * 3);
  sg.addColorStop(0, 'rgba(255,250,235,1)'); sg.addColorStop(.33, 'rgba(255,236,190,.9)'); sg.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(CX, sunY, sunR * 3, 0, PI2); ctx.fill();
  // the city wakes up
  for (const b of skyline) {
    const bh = b.h * (.6 + .4 * k);
    ctx.fillStyle = '#120c14'; ctx.fillRect(b.x, H - bh, b.w, bh);
    ctx.fillStyle = `rgba(255,214,140,${.8 * (1 - k * .6)})`;
    b.lit.forEach((on, i) => { if (on && (i % 3) * 14 + 8 < bh - 8) ctx.fillRect(b.x + 4 + (i % 2) * 8, H - bh + 8 + Math.floor(i / 2) * 14, 4, 6); });
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
  const ink = '#1a1416';
  lines(T, [
    [4.0, 'Ты успел всё.', `italic 600 34px ${SERIF}`, H * .18],
    [5.0, `Все ${n} ${plural(n, 'звезда', 'звезды', 'звёзд')} — с тобой.`, `italic 500 21px ${SERIF}`, H * .18 + 40],
  ], ink);
  // GOING TO THE END → GOING TO THE BEGINNING
  if (T > 6.6) {
    const a = clamp((T - 6.6) / .8, 0, 1), font = `600 34px ${SERIF}`, y = H * .38;
    ctx.font = font;
    const head = 'GOING TO THE ', hw = ctx.measureText(head).width;
    const typed = 'BEGINNING'.slice(0, Math.floor(clamp((T - 8.6) / 1.2, 0, 1) * 9));
    const tail = T < 8.6 ? 'END' : typed;
    const total = hw + ctx.measureText(tail || 'END').width, x0 = CX - total / 2;
    ctx.globalAlpha = a; ctx.fillStyle = ink; ctx.textAlign = 'left';
    ctx.fillText(head, x0, y);
    if (T < 8.6) {
      ctx.fillText('END', x0 + hw, y);
      const s = clamp((T - 7.8) / .5, 0, 1), ew = ctx.measureText('END').width;
      if (s > 0) { ctx.fillStyle = CUT; ctx.fillRect(x0 + hw - 2, y - 12, (ew + 4) * s, 3); }
    } else {
      ctx.fillStyle = '#b5291f'; ctx.fillText(tail, x0 + hw, y);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'center';
  }
  lines(T, [[10.4, MOTTO, `600 22px ${MONO}`, H * .38 + 56, '#b5291f']], ink);
  endingStats(T, 11.2, '#3a2a24');
}

// ---------- hud ----------
function hud() {
  $('lvl').textContent = `${S.li + 1} / ${LEVELS.length} · ${checkpoints[S.cp] ? checkpoints[S.cp].name : ''}`;
  $('take').textContent = S.take;
  $('stars').textContent = `${stars.filter(s => s.got).length} / ${stars.length}`;
  $('fresh').hidden = !(S.mode === 'menu' && RUN.li > 0);
  $('cheatTag').hidden = !(CHEAT.on || RUN.cheat);
  $('pause').setAttribute('aria-pressed', String(S.mode === 'pause'));
  timer();
}
function timer() {
  const el = $('time');
  // the marathon runs on one clock for the whole evening
  const m = RUN.kind === 'marathon', now = m ? marathonTime() : S.time, par = m ? EVENING * GUEST_PAR : S.par;
  el.textContent = `${fmt(now)} / ${fmt(par)}`;
  el.classList.toggle('late', now > par);
}

// ===== src/js/21-loop.js =====
// ---------- loop ----------
// physics runs in fixed steps of 1/120 s, so the game plays the same on 60, 144 and 240 Hz screens
const STEP = 1 / 120;
let last = performance.now(), lastSec = -1, acc = 0, timeScale = 1;
function frame(t) {
  acc = Math.min(acc + Math.max(0, (t - last) / 1000) * timeScale, .1); last = t;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render(t);
  const sec = Math.floor(S.time);
  if (sec !== lastSec) { lastSec = sec; timer(); }
  requestAnimationFrame(frame);
}

// ===== src/js/22-input.js =====
// ---------- input ----------
function togglePause(force) {
  if (S.mode === 'pause' && force !== true) { S.mode = S.pauseFrom; S.pauseFrom = null; }
  else if (S.mode === 'play' || S.mode === 'cut') { S.pauseFrom = S.mode; S.mode = 'pause'; keys.left = keys.right = keys.jump = false; }
  hud();
}
function newRun() {
  RUN = freshRun(); saveRun();
  toMenu();
}
function press(k) {
  audioInit();
  if (S.mode === 'pause') { togglePause(); return; }
  if (S.mode === 'menu') { if (k === 'left') menuMove(menu.screen === 'levels' ? -9 : -1); else if (k === 'right') menuMove(menu.screen === 'levels' ? 9 : 1); else menuActivate(); return; }
  if (S.mode === 'intro') { if (S.modeT > .6) play(); return; }
  if (S.mode === 'clear') {
    if (S.mdone) { if (S.modeT > 2.4) toMenu(); }
    else if (RUN.kind !== 'marathon' && S.modeT > 2.2) reelChange(() => startLevel(RUN.li));
    return;
  }
  if (S.mode === 'ending') {
    if (S.modeT > ENDING_LEN[S.ending] || S.replay && S.modeT > 1) toMenu(S.replay ? 'endings' : 'main');
    return;
  }
  if (k === 'jump') S.p.buffer = .12;
}
const MAP = {
  ArrowLeft: 'left', a: 'left', 'ф': 'left',
  ArrowRight: 'right', d: 'right', 'в': 'right',
  ' ': 'jump', ArrowUp: 'jump', w: 'jump', 'ц': 'jump', Enter: 'jump',
};
const keyOf = e => MAP[e.key.length === 1 ? e.key.toLowerCase() : e.key];
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const ch = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (ch === 'm' || ch === 'ь') { setMute(!AU.muted); return; }
  if (ch === 'f' || ch === 'а' || ch === 'F11') { e.preventDefault(); toggleFullscreen(); return; }
  if (S.mode === 'menu') {
    if (ch === 'ArrowUp' || ch === 'w' || ch === 'ц') { e.preventDefault(); menuMove(-1); return; }
    if (ch === 'ArrowDown' || ch === 's' || ch === 'ы') { e.preventDefault(); menuMove(1); return; }
    if (ch === 'Escape' || ch === 'Backspace') { e.preventDefault(); menuBack(); return; }
    if (ch === 'n' || ch === 'т') { newRun(); return; }
  }
  if (S.mode === 'ending' && S.replay && ch === 'Escape') { toMenu('endings'); return; }
  // leaving the marathon halfway: back to the menu from the pause
  if (S.mode === 'pause' && RUN.kind === 'marathon' && (ch === 'q' || ch === 'й')) { toMenu(); return; }
  if ((ch === 'k' || ch === 'л') && CHEAT.on && S.mode === 'play') { RUN.cheat = true; finishLevel(); return; }
  if (ch === 'p' || ch === 'з' || ch === 'Escape') { e.preventDefault(); togglePause(); return; }
  const k = keyOf(e);
  if (!k) return;
  e.preventDefault();
  if (e.repeat) return;
  keys[k] = true;
  press(k);
});
addEventListener('keyup', e => {
  const k = keyOf(e);
  if (!k) return;
  keys[k] = false;
  // a short tap gives a short hop
  if (k === 'jump' && S.p.vy < 0) S.p.vy *= .5;
});
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; if (S.mode === 'play') togglePause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S.mode === 'play') togglePause(true); });
cv.addEventListener('pointerdown', e => {
  if (S.mode === 'menu') {
    // tap a menu row to open it
    const r = cv.getBoundingClientRect(), y = (e.clientY - r.top) / r.height * H;
    const x = (e.clientX - r.left) / r.width * W;
    const row = menu.rows.find(q => y >= q.y0 && y <= q.y1 && x >= q.x0 && x <= q.x1);
    if (row) { audioInit(); menuActivate(row.i); }
    return;
  }
  if (S.mode !== 'play' && S.mode !== 'cut') press('jump');
});
for (const b of $('pads').querySelectorAll('button')) {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); keys[k] = true; b.classList.add('on'); press(k); };
  const up = () => { keys[k] = false; b.classList.remove('on'); if (k === 'jump' && S.p.vy < 0) S.p.vy *= .5; };
  b.addEventListener('pointerdown', down);
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, up);
}
$('snd').addEventListener('click', () => setMute(!AU.muted));
$('pause').addEventListener('click', () => togglePause());
$('fresh').addEventListener('click', newRun);
$('full').addEventListener('click', toggleFullscreen);

// ===== the battle box: every few seconds the frame shrinks to a white box and bones fly through it =====
const BOX_W = 230, BOX_H = 104;
MECH.battle = {
  hint: 'появилась рамка — прыгай через кости',
  reset() { S.battle = { phase: 'idle', t: 0, next: rand(3.5, 5), bones: [] }; },
  frozen: () => S.battle && S.battle.phase !== 'idle',
  update(dt) {
    const B = S.battle, p = S.p;
    B.t += dt;
    if (B.phase === 'idle') {
      B.next -= dt;
      if (B.next > 0) return;

      B.spawn -= dt;
      if (B.spawn <= 0 && B.t < B.len - .9) {

        const fromL = B.n % 2 === 0;
        B.bones.push({ x: fromL ? B.x0 + 4 : B.x1 - 4, vx: (fromL ? 1 : -1) * rand(190, 235), high: Math.random() < .3 });
        B.n++;

      B.bones = B.bones.filter(b => b.x > B.x0 - 2 && b.x < B.x1 + 2);

      const d = dotWorld();
      for (const b of B.bones) {
        if (Math.abs(d.x - b.x) > 8) continue;
        if (!b.high && d.y > B.floor - 28) { cut('Кость оказалась быстрее'); return; }

  },
  constrain(p) {
    const B = S.battle;

    if (p.y + PH > B.floor) { p.y = B.floor - PH; p.vy = 0; p.ground = B.ground; }

  },
  draw() {

      ctx.fillStyle = c; ctx.fillRect(b.x - 3, top + 3, 6, bot - top - 6);

function addWantedStar() {

// ---------- hazards of the five films ----------
Object.assign(HZ, {

        S.floaters.push({ x: S.p.x, y: S.p.y, t: 0, text: 'ПАРИРОВАНО!', col: '#ff8ab8' });

      S.hz.push({ type: 'imp', screen: true, x: fromL ? 26 : W - 26, y: clamp(d.y + rand(-70, 50), 70, H - 60), fromL, warn: .85, t: 0 });
      if (Math.random() < .35 && S.hz.filter(h => h.type === 'barrel').length < 2) {

// ---------- what happens to THE END ----------
Object.assign(GAGS, {
  soul: {
    init(g) { g.say = ''; },
    update(g, T) { g.letters.forEach((l, i) => { if (T > .3 + i * .15) l.tint = '#ffd23f'; }); gcue(g, 'spare', .3, () => [523, 659, 784].forEach((f, i) => tone(f, .25, .08, i * .1, 'square'))); },
    over(g, T, t) {
      // the battle menu pops up above THE END with MERCY picked, then the line types itself out
      const labels = ['БИТЬ', 'ГОВОРИТЬ', 'ВЕЩИ', 'ПОЩАДА'], y = g.top - 50, w = 104, k = clamp((T - .8) / .3, 0, 1);
      if (!k) return;
      ctx.globalAlpha = k;
      const line = '* Ты пощадил титры.', n = Math.floor(clamp((T - 1.3) * 18, 0, line.length));
      ctx.fillStyle = '#ffffff'; ctx.font = `400 18px ${TINY}`; ctx.textAlign = 'left'; ctx.fillText(line.slice(0, n), CX - 2 * w - 6, y - 18);
      labels.forEach((s, i) => {
        const x = CX - 2 * w - 6 + i * (w + 4), sel = i === 3;
        ctx.strokeStyle = sel ? '#ffd23f' : '#ff7a1f'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, 26);
        ctx.fillStyle = sel ? '#ffd23f' : '#ff7a1f'; ctx.font = `400 13px ${TINY}`; ctx.textAlign = 'center'; ctx.fillText(s, x + w / 2 + (sel ? 6 : 0), y + 18);
        if (sel) drawSoul(x + 12, y + 13);
      });
      ctx.textAlign = 'left'; ctx.globalAlpha = 1;
    },
  },
  cup: {
    init(g) { g.say = ''; },
    update(g, T, dt) {
      if (S.bossC) S.bossC.dead = Math.min(1.5, (S.bossC.dead || 0) + dt * .6);
      g.letters.forEach((l, i) => { l.dy = Math.sin(T * 6 + i) * 6; l.rot = Math.sin(T * 5 + i) * .1; });
      gcue(g, 'ko', .5, () => { noise(.3, .5, 600, 'lowpass'); [392, 523, 659, 784].forEach((f, i) => tone(f, .35, .08, i * .08, 'triangle')); });
    },
    screen(g, T) {
      if (T < .5) return;
      const k = clamp((T - .5) / .25, 0, 1), s = 3 - 2 * ease(k);
      ctx.save(); ctx.translate(CX, H * .48); ctx.scale(s, s); ctx.globalAlpha = k;
      ctx.font = `400 64px ${LOBSTER}`; ctx.textAlign = 'center';
      ctx.fillStyle = '#1a120a'; ctx.fillText('НОКАУТ!', 4, 4); ctx.fillStyle = '#e8432a'; ctx.fillText('НОКАУТ!', 0, 0);
      ctx.restore();
    },
  },
  wanted: {
    init(g) { g.say = ''; },
    update(g, T) {
      const Wd = S.wanted;
      if (Wd) for (let i = 0; i < 5; i++) gcue(g, 'star' + i, .6 + i * .3, () => { Wd.stars = Math.max(0, Wd.stars - 1); tone(880 - i * 60, .12, .06, 0, 'square'); });
      gcue(g, 'done', .4, () => [392, 494, 587, 784].forEach((f, i) => tone(f, .5, .08, i * .12, 'sawtooth')));
    },
    screen(g, T) {
      if (T < .4) return;
      const k = clamp((T - .4) / .4, 0, 1);
      ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
      caption('МИССИЯ ВЫПОЛНЕНА', `400 30px ${SEYMOUR}`, H * .48, '#ffd23f', k);
      caption('+ УВАЖЕНИЕ', `400 16px ${DAYS}`, H * .48 + 30, '#ffffff', k);
      ctx.shadowBlur = 0;
    },
  },
  hell: {
    init(g) { g.say = 'Рви и мечи'; g.sayAt = 2.2; g.saw = g.x0 - 60; },
    update(g, T, dt) {
      if (T < .3) return;
      g.saw += 220 * dt;
      gcue(g, 'rev', .3, () => noise(1.8, .25, 1200, 'bandpass'));
      for (const l of g.letters) { l.h = g.size; if (g.saw > l.x + l.w / 2) l.split = Math.min(1, (l.split || 0) + dt * 2.5); }
      if (Math.random() < .5 && g.saw < g.x1 + 30) S.parts.push({ x: g.saw, y: midY(g), vx: rand(-80, 80), vy: rand(-160, -40), life: .5, t: 0, color: pick(['#ff9a3c', '#ffd23f']), size: 2 });
    },
    over(g, T, t) {
      if (T < .3 || g.saw > g.x1 + 120) return;
      const y = midY(g), j = Math.sin(t * .2) * 1.5;
      ctx.fillStyle = '#c9ced6'; rr(g.saw - 6, y - 5 + j, 70, 10, 5); ctx.fill();
      ctx.fillStyle = '#1a1a1a'; for (let x = 0; x < 70; x += 6) ctx.fillRect(g.saw - 6 + x, y - 7 + j, 3, 2);
      ctx.fillStyle = '#ff7a1f'; rr(g.saw - 44, y - 14 + j, 40, 26, 5); ctx.fill();
    },
  },
  neon: {
    init(g) { g.say = 'Уровень зачищен'; g.sayAt = 1.6; g.sayCol = '#00f0ff'; },
    update(g, T) {
      const cols = ['#ff2ad8', '#00f0ff', '#ffe14d', '#ffffff'];
      g.letters.forEach((l, i) => { l.tint = cols[(i + Math.floor(T * 8)) % cols.length]; l.dx = (Math.random() - .5) * 3; });
      gcue(g, 'beat', .2, () => [0, .25, .5, .75].forEach(w => noise(.08, .4, 120, 'lowpass')));
    },
    screen(g, T) {
      ctx.shadowColor = '#ff2ad8'; ctx.shadowBlur = 16;
      caption(`СЧЁТ ${S.score || 0}`, `400 34px ${PACIFICO}`, g.top - S.camY - 96, '#ffe14d', clamp(T / .4, 0, 1));
      ctx.shadowBlur = 0;
    },
  },
});

// ===== src/js/22c-modes.js =====
// ---------- modes: reel changes between films and the marathon ----------

// ===== a reel change: the last frame is pulled up through the gate and the next reel runs in =====
const reelShot = document.createElement('canvas');
reelShot.width = cv.width; reelShot.height = cv.height;
let REEL = null;
function reelChange(fn) {
  reelShot.getContext('2d').drawImage(cv, 0, 0);
  REEL = { at: performance.now() };
  noise(.35, .22, 2400, 'bandpass'); sweep(140, 60, .3, .06, 'sawtooth');
  fn();
}
function drawReel(t) {
  if (!REEL) return;
  // the frame's timestamp can be a little older than the key press that started the change
  const k = Math.max(0, (t - REEL.at) / 620);
  if (k >= 1) { REEL = null; return; }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const e = k * k * (3 - 2 * k), off = -e * (H + 60);
  // motion blur: the old frame smeared along the pull
  ctx.globalAlpha = 1; ctx.drawImage(reelShot, 0, off, W, H);
  if (!REDUCED) { ctx.globalAlpha = .35; ctx.drawImage(reelShot, 0, off + 26 * (1 - k), W, H); ctx.globalAlpha = .18; ctx.drawImage(reelShot, 0, off + 60 * (1 - k), W, H); }
  ctx.globalAlpha = 1;
  // the frame line between the two reels, with a splice of tape
  const fl = off + H;
  ctx.fillStyle = '#050405'; ctx.fillRect(0, fl, W, 60);
  ctx.fillStyle = 'rgba(255,248,225,.16)'; ctx.fillRect(0, fl + 24, W, 12);
  // sprocket holes on both edges racing past
  for (const x of [0, W - 22]) {
    ctx.fillStyle = '#0b0909'; ctx.fillRect(x, 0, 22, H);
    for (let y = (-k * 900) % 34; y < H; y += 34) { ctx.fillStyle = '#2a2424'; rr(x + 5, y, 12, 18, 3); ctx.fill(); }
  }
  // a hot flash as the splice crosses the lamp
  const f = Math.max(0, 1 - Math.abs(k - .55) / .12);
  if (f > 0) { ctx.fillStyle = `rgba(255,246,225,${.5 * f})`; ctx.fillRect(0, 0, W, H); }
}
// the projectionist's cue marks: a burnt circle in the top right corner, twice, just before the change
function drawCueMarks(T, at) {
  for (const a of [at, at + .8]) {
    if (T < a || T > a + .12) continue;
    const x = W - 46, y = 46;
    ctx.fillStyle = 'rgba(10,8,8,.92)'; ctx.beginPath();
    for (let i = 0; i <= 18; i++) { const ang = i / 18 * PI2, r = 15 + Math.sin(i * 2.7) * 2.2; ctx.lineTo(x + Math.cos(ang) * r, y + Math.sin(ang) * r); }
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,170,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

// ===== the marathon: every film back to back on one clock =====
function startMarathon() {
  RUN = freshRun('marathon');
  if (CHEAT.on) RUN.cheat = true;
  reelChange(() => startLevel(0, 'intro'));
}
function marathonStep() {
  S.mode = 'clear'; S.modeT = 0; S.gag = makeGag();
  [523.3, 659.3, 784].forEach((f, i) => tone(f, 1.6, .08, i * .1));
  if (!LV.final) { RUN.li = S.li + 1; return; }
  const r = RUN.res.filter(Boolean), M = S.mdone = {
    time: r.reduce((s, x) => s + x.t, 0), deaths: r.reduce((s, x) => s + x.takes - 1, 0),
    got: r.reduce((s, x) => s + x.got, 0), total: r.reduce((s, x) => s + x.total, 0), best: +store.get('gtte-marathon-best') || 0,
  };
  if (!RUN.cheat && (!M.best || M.time < M.best)) { store.set('gtte-marathon-best', M.time.toFixed(2)); M.record = true; }
}
// the clock the marathon runs on: every finished film plus the one on screen
function marathonTime() { let s = S.time; for (let i = 0; i < S.li; i++) if (RUN.res[i]) s += RUN.res[i].t; return s; }
function nextFilm() { reelChange(() => startLevel(RUN.li, 'intro')); }

// ===== cards drawn over a finished film in the special modes =====
function drawMarathonClear() {
  const T = S.modeT;
  if (S.mdone) {
    const M = S.mdone, k = clamp((T - 1.2) / .8, 0, 1);
    if (k <= 0) return;
    ctx.fillStyle = `rgba(6,5,8,${.88 * k})`; rr(28, H * .12, W - 56, 230, 10); ctx.fill();
    caption('МАРАФОН ОКОНЧЕН', `500 12px ${MONO}`, H * .12 + 36, '#a59d92', k);
    caption(fmt(M.time), `600 64px ${SERIF}`, H * .12 + 104, M.time <= EVENING * GUEST_PAR ? '#b9f27c' : CUT, k);
    caption(M.record ? 'НОВЫЙ РЕКОРД' : M.best ? `РЕКОРД ${fmt(M.best)}` : '', `500 12px ${MONO}`, H * .12 + 132, '#ffd23f', k);
    caption(`${EVENING} ФИЛЬМОВ · ${M.deaths} ${plural(M.deaths, 'ДУБЛЬ', 'ДУБЛЯ', 'ДУБЛЕЙ')} · ★ ${M.got} / ${M.total}`, `500 12px ${MONO}`, H * .12 + 166, '#efe8dc', k);
    if (T > 2.4) caption('ПРОБЕЛ — В МЕНЮ', `500 11px ${MONO}`, H * .12 + 206, '#a59d92', k);
    return;
  }
  // between films: one line under the gag, then the cue marks and the change
  const r = RUN.res[S.li], k = clamp((T - .6) / .5, 0, 1);
  if (r) caption(`${S.li + 1} / ${EVENING} · ${fmt(r.t)} · ★ ${r.got}/${r.total} · ДАЛЬШЕ: ${LEVELS[S.li + 1].name.toUpperCase()}`, `500 11px ${MONO}`, H - 30, LV.pal.light ? '#1b1b3a' : '#d8d0c4', k);
  drawCueMarks(T, 1.5);
}

// ===== src/js/23-boot.js =====
// ---------- boot: re-measure the words once the typefaces arrive ----------
const fontsReady = Promise.race([
  Promise.all(LEVELS.flatMap(L => Object.values(L.fonts).map(f => document.fonts.load(f[0], 'АБВ THE END')))),
  new Promise(r => setTimeout(r, 2500)),
]).catch(() => {});
$('snd').setAttribute('aria-pressed', String(!AU.muted));
startLevel(RUN.li, 'menu');
requestAnimationFrame(frame);
fontsReady.then(() => { if (S.mode === 'menu') startLevel(RUN.li, 'menu'); });
})();
</script>
